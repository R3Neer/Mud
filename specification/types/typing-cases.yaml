    - types:
      - name: Nat
      - name: Money
    candidates:
    - givens:
      - name: value
        type:
          name: Nat
      identity: a.Play
      receivers:
      - name: Actor
    - givens:
      - name: value
        type:
          name: Money
      identity: b.Play
      receivers:
