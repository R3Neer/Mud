- id: sequential-key-replacement
  rules:
  - MUD-EFFECT-006
  source: then { dict[key] = a; dict[key] = b }
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: One sequential effect block replacing an existing key keeps its proved cardinality and finishes
    with b. This is not a sibling replacement conflict.
- id: has-operand-direction
  rules:
  - MUD-TYPE-009
  source: values has candidate
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: values is a Nat collection and candidate is singleton Nat. The result is singleton Bool; the collection
    is the left operand.
- id: nat-intrinsic-domain
  rules:
  - MUD-TYPE-005
  source: 'nonnegative: Int in [0..*] = natural'
  source_scope: read-only-inclusion-judgement-fragment
  expected: static-accept
  contract: natural has Nat contract. Its intrinsic nonnegative domain discharges read-only inclusion without
    a value-specific runtime test.
  witness:
    kind: inclusion
    source:
      name: Nat
    target:
      name: Int
      domain:
      - 0
      - null
- id: any-only-join-keeps-union
  rules:
  - MUD-TYPE-008
  source: result := chosen.Stats()
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: The static callable alternatives are distinct produced types whose only common upper contract
    is Any. Synthesis retains the produced-type union rather than replacing it with Any.
- id: possible-known-key-conflict
  rules:
  - MUD-EFFECT-006
  source: 'then dict[key] = a

    then dict[key] = b'
  source_scope: independent-concurrent-block-fragments
  expected: runtime-check
  contract: Independent blocks have different replacement values and one known existing key. Admitted guards
    have a witnessed joint firing but do not imply it inevitably. Report a possible-conflict warning and check
    actual consolidation; cardinality is separately proved safe.
- id: inevitable-known-key-conflict
  rules:
  - MUD-EFFECT-006
  source: 'then dict[key] = a

    then dict[key] = b'
  source_scope: independent-concurrent-block-fragments
  expected: static-reject
  contract: Entry/guard facts prove both independent contributions fire together with different known replacement
    values at the same key. The conflict is inevitable, so reject statically.
- id: ambiguous-numeric-literal
  rules:
  - MUD-TYPE-008
  - MUD-TYPE-009
  source: number := 3
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: No expected type or dependency disambiguates Nat, Int, Num and Money. Numeric inference supplies
    no default priority.
- id: negative-static-step
  rules:
  - MUD-TYPE-005
  source: 'values: Nat in [1..8] by -2 = all'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: 'The static compatible signed difference anchors membership at the upper bound: 8,6,4,2. Canonical
    all materialisation is 2,4,6,8. Nonzero advance and finite bounds prove finiteness.'
- id: immutable-outer-shape-inference
  rules:
  - MUD-TYPE-002
  - MUD-EFFECT-004
  source: 'thing Counters { values: Nat = 1, 2, 3 }'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: The immutable stored field supplies its explicit Nat member context and infers outer cardinality
    [3] from its closed static initializer.
- id: runtime-dependent-schema-initializer
  rules:
  - MUD-EFFECT-003
  - MUD-EFFECT-004
  source: 'thing Counter { value: Nat = other.CounterNow() }'
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: CounterNow depends on mutable runtime-world state. A stored thing schema initializer must be statically
    evaluable even when the look is externally pure.
- id: sole-action-reply-capture
  rules:
  - MUD-TYPE-014
  source: 'reply: ActionReply = actor.Move()'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Move is an admitted action in an effect owner; its only ordinary output is ActionReply.
- id: no-additional-action-domain-result
  rules:
  - MUD-TYPE-014
  source: 'distance: Nat = actor.Move()'
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Move is an action, not a look. Its ActionReply cannot be captured as Nat or carry a second domain output.
- id: sole-subaction-reply-capture
  rules:
  - MUD-TYPE-014
  source: 'reply: ActionReply = actor.Step()'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Step is an admitted subaction invoked within its permitted parent effect owner. Its only result is ActionReply.
