schema_version: 1
scope: Declarative fragments and finite derivation witnesses; no MUD parser/runtime claim
cases:
- id: exact-widening
  rules:
  - MUD-TYPE-002
  - MUD-TYPE-005
  source: 'wide: Num = natural'
  source_scope: read-only-inclusion-judgement-fragment
  expected: static-accept
  contract: Nat widens through Int to Num. The witness disposition concerns unconditional inclusion, not an
    independently permitted runtime admission of this fragment.
  witness:
    kind: inclusion
    source:
      name: Nat
    target:
      name: Num
    parents: {}
- id: approximate-mix-rejected
  rules:
  - MUD-TYPE-002
  - MUD-TYPE-005
  source: 'approximate: Rum = exact'
  source_scope: read-only-inclusion-judgement-fragment
  expected: static-reject
  contract: Exact/approximate mixing needs an explicit quantitative conversion. The witness disposition concerns
    unconditional inclusion, not an independently permitted runtime admission of this fragment.
  witness:
    kind: inclusion
    source:
      name: Num
    target:
      name: Rum
    parents: {}
- id: narrower-cardinality
  rules:
  - MUD-TYPE-002
  - MUD-TYPE-005
  source: receiver.Use(values)
  source_scope: read-only-inclusion-judgement-fragment
  expected: static-accept
  contract: Readonly inclusion preserves complete cardinality guarantees. The witness disposition concerns
    unconditional inclusion, not an independently permitted runtime admission of this fragment.
  witness:
    kind: inclusion
    source:
      name: Nat
      card:
      - 2
      - 3
    target:
      name: Int
      card:
      - 0
      - 5
    parents: {}
- id: broader-cardinality-not-subtyping
  rules:
  - MUD-TYPE-002
  - MUD-TYPE-005
  source: receiver.Use(values)
  source_scope: read-only-inclusion-judgement-fragment
  expected: static-reject
  contract: Potential value admission is not unconditional subtyping. The witness disposition concerns unconditional
    inclusion, not an independently permitted runtime admission of this fragment.
  witness:
    kind: inclusion
    source:
      name: Nat
      card:
      - 0
      - 5
    target:
      name: Int
      card:
      - 2
      - 3
    parents: {}
- id: key-unique-implies-value-unique
  rules:
  - MUD-TYPE-002
  - MUD-TYPE-005
  source: receiver.Use(people)
  source_scope: read-only-inclusion-judgement-fragment
  expected: static-accept
  contract: Stable keyed uniqueness implies whole-value uniqueness. The witness disposition concerns unconditional
    inclusion, not an independently permitted runtime admission of this fragment.
  witness:
    kind: inclusion
    source:
      name: Person
      unique: key:email
    target:
      name: Person
      unique: value
    parents: {}
- id: different-order-criteria
  rules:
  - MUD-TYPE-002
  - MUD-TYPE-005
  source: receiver.Use(people)
  source_scope: read-only-inclusion-judgement-fragment
  expected: static-reject
  contract: Observable ordering criteria are not interchangeable. The witness disposition concerns unconditional
    inclusion, not an independently permitted runtime admission of this fragment.
  witness:
    kind: inclusion
    source:
      name: Person
      order: age
    target:
      name: Person
      order: name
    parents: {}
- id: authority-not-manufactured
  rules:
  - MUD-TYPE-002
  - MUD-TYPE-005
  source: receiver.Edit(people)
  source_scope: read-only-inclusion-judgement-fragment
  expected: static-reject
  contract: A readonly source cannot satisfy requested inner authority. The witness disposition concerns unconditional
    inclusion, not an independently permitted runtime admission of this fragment.
  witness:
    kind: inclusion
    source:
      name: Person
      inner_mut: false
    target:
      name: Person
      inner_mut: true
    parents: {}
- id: nominal-alias-not-erased
  rules:
  - MUD-TYPE-002
  - MUD-TYPE-005
  source: 'raw: Text = playerName'
  source_scope: read-only-inclusion-judgement-fragment
  expected: static-reject
  contract: Nominal representation equality is not implicit subtyping. The witness disposition concerns unconditional
    inclusion, not an independently permitted runtime admission of this fragment.
  witness:
    kind: inclusion
    source:
      name: PlayerName
    target:
      name: Text
    parents: {}
- id: callable-input-contravariance
  rules:
  - MUD-TYPE-007
  - MUD-EFFECT-001
  source: receiver.Operation(argument)
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Static callable contracts check input variance, result covariance and writable invariance.
  witness:
    kind: callable
    parents: &id001
      Dog:
      - Animal
    supplied:
      inputs:
      - mode: read
        type:
          name: Animal
      output:
        name: Dog
    requested:
      inputs:
      - mode: read
        type:
          name: Dog
      output:
        name: Animal
- id: callable-input-too-narrow
  rules:
  - MUD-TYPE-007
  - MUD-EFFECT-001
  source: receiver.Operation(argument)
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Static callable contracts check input variance, result covariance and writable invariance.
  witness:
    kind: callable
    parents: *id001
    supplied:
      inputs:
      - mode: read
        type:
          name: Dog
      output:
        name: Dog
    requested:
      inputs:
      - mode: read
        type:
          name: Animal
      output:
        name: Animal
- id: writable-input-invariance
  rules:
  - MUD-TYPE-007
  - MUD-EFFECT-001
  source: receiver.Operation(argument)
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Static callable contracts check input variance, result covariance and writable invariance.
  witness:
    kind: callable
    parents: *id001
    supplied:
      inputs:
      - mode: write
        type:
          name: Animal
      output:
        name: Dog
    requested:
      inputs:
      - mode: write
        type:
          name: Dog
      output:
        name: Animal
- id: recursive-empty-exit
  rules:
  - MUD-TYPE-004
  source: 'alias Tree { children: Tree [*] = empty }'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Finite constructor witnesses require a productive exit, valid domains and enough unique members.
  witness:
    kind: productivity
    root: Tree
    nodes:
      Tree:
        kind: product
        children:
        - Children
      Children:
        kind: container
        minimum: 0
        children:
        - Tree
- id: mandatory-cycle
  rules:
  - MUD-TYPE-004
  source: 'alias Chain { next: Chain }'
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Finite constructor witnesses require a productive exit, valid domains and enough unique members.
  witness:
    kind: productivity
    root: Chain
    nodes:
      Chain:
        kind: product
        children:
        - Chain
- id: abstract-concrete-witness
  rules:
  - MUD-TYPE-004
  source: 'abstract alias Problem { reason: Text }; alias Missing as Problem'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Finite constructor witnesses require a productive exit, valid domains and enough unique members.
  witness:
    kind: productivity
    root: Problem
    nodes:
      Missing:
        kind: product
        children:
        - Text
      Text:
        kind: leaf
      Problem:
        kind: abstract
        children:
        - Missing
- id: positive-unique-needs-enough-witnesses
  rules:
  - MUD-TYPE-004
  source: 'alias Group { members: Member [2 unique] }'
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Finite constructor witnesses require a productive exit, valid domains and enough unique members.
  witness:
    kind: productivity
    root: Group
    nodes:
      Group:
        kind: container
        minimum: 2
        unique: true
        witness_count: 1
        children:
        - One
      One:
        kind: leaf
- id: transparent-recursion
  rules:
  - MUD-TYPE-004
  source: alias A := B; alias B := A
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Finite constructor witnesses require a productive exit, valid domains and enough unique members.
  witness:
    kind: productivity
    root: A
    nodes:
      A:
        kind: transparent
        children:
        - B
      B:
        kind: transparent
        children:
        - A
- id: recursive-same-shape
  rules:
  - MUD-TYPE-006
  source: left to Right
  source_scope: representation-judgement-fragment
  expected: static-accept
  contract: Bisimulation checks local labels and all recursive child pairs; this proves shape only, not inhabitation.
    The expected disposition is only representation equivalence of the finite graphs. These mandatory cycles
    are not admitted alias declarations or evidence of a constructible value; complete programme checking
    separately rejects them.
  witness:
    kind: representation
    nodes:
      A:
        kind: product
        label:
        - value
        - next
        children:
        - Text
        - A
      B:
        kind: product
        label:
        - value
        - next
        children:
        - Text
        - B
      Text:
        kind: leaf
        label: Text
      Int:
        kind: leaf
        label: Int
    left: A
    right: B
- id: recursive-shape-mismatch
  rules:
  - MUD-TYPE-006
  source: left to Right
  source_scope: representation-judgement-fragment
  expected: static-reject
  contract: Bisimulation checks local labels and all recursive child pairs; this proves shape only, not inhabitation.
    The expected disposition is only representation equivalence of the finite graphs. These mandatory cycles
    are not admitted alias declarations or evidence of a constructible value; complete programme checking
    separately rejects them.
  witness:
    kind: representation
    nodes:
      A:
        kind: product
        label:
        - value
        - next
        children:
        - Text
        - A
      B:
        kind: product
        label:
        - value
        - next
        children:
        - Int
        - B
      Text:
        kind: leaf
        label: Text
      Int:
        kind: leaf
        label: Int
    left: A
    right: B
- id: unknown-stored-cardinality
  rules:
  - MUD-EFFECT-005
  - MUD-TYPE-005
  source: then { remove current from kings; add replacement to kings }
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: The replace example needs current membership/replacement validity evidence; runtime value admission
    cannot replace stored-cardinality proof.
  witness:
    kind: proof-boundary
    context: stored-cardinality
    proof: unknown
