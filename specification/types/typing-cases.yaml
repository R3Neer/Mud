  rules:
  - MUD-TYPE-017
  source: abstract thing Derived as T Base with T { }
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Base is an abstract arity-one generic thing. Postfix T Base precedes the with group introducing local parameter T; joint header resolution admits its earlier ancestor occurrence.
