  - MUD-TYPE-005
  source: then { remove current from kings; add replacement to kings }
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: The replace example needs current membership/replacement validity evidence; runtime value admission
    cannot replace stored-cardinality proof.
  witness:
    kind: proof-boundary
    context: stored-cardinality
    proof: unknown
