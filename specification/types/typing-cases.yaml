- id: given-defaults-do-not-select
  rules:
  - MUD-TYPE-001
  source: actor.Play()
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Both candidate signatures supply explicit defaults. Omission invents no static argument evidence or
    priority; the receiver tie remains.
  witness:
    arguments: []
    candidates:
    - givens:
      - name: value
        type:
          name: Nat
        default: true
      identity: a.Play
      receivers:
      - name: Actor
    - givens:
      - name: value
        type:
          name: Text
        default: true
      identity: b.Play
      receivers:
      - name: Actor
    kind: given-selection
    receivers:
    - name: Actor
- id: given-expected-result-does-not-select
  rules:
  - MUD-TYPE-001
  source: 'reply: Expected = actor.Read(textValue)'
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Both homonymous visible look signatures accept the same Actor/Text arguments; different result types
    cannot break the tie.
- id: generic-grouped-union-argument
  rules:
  - MUD-TYPE-017
  source: 'alias Box with T { value: T }

    look Values { item: Box with (Nat | Text) := (value = "cat") }'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: A grouped union is one member-form argument; direct per-alternative domains/cardinalities and dictionary
    alternatives remain prohibited. The named structural literal supplies one component.
- id: given-required-versus-default-binding
  rules:
  - MUD-TYPE-001
  source: actor.Play()
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: 'At the first lookup level both candidates accept Actor receivers. Candidate a requires given value:
    Nat without a default; candidate b supplies a declared default. Missing required binding excludes a, so b remains.
    If both admit omission, no default value/type is invented to break the tie.'
- id: given-union-no-runtime-dispatch
  rules:
  - MUD-TYPE-001
  source: actor.Play(value)
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: value has static Nat | Text. The first lookup level has separate Actor operations accepting Nat and
    Text. No one declaration admits every alternative; no runtime dispatch selects a declaration from value type.
- id: given-unknown-admission-keeps-candidates
  rules:
  - MUD-TYPE-001
  source: actor.Play(values)
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Both candidates have compatible Actor/Nat member types. Cardinality admission remains unknown and runtime-checkable.
    That obligation is not proven incompatibility and cannot choose either candidate.
  witness:
    kind: given-selection
    receivers:
    - name: Actor
    arguments:
    - types:
      - name: Nat
        card:
        - 0
        - 10
        unknown_admission: true
    candidates:
    - identity: a.Play
      receivers:
      - name: Actor
      givens:
      - name: values
        type:
          name: Nat
          card:
          - 0
          - 5
    - identity: b.Play
      receivers:
      - name: Actor
      givens:
      - name: values
        type:
          name: Nat
          card:
          - 0
          - 7
