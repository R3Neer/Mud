  rules:
  - MUD-TYPE-017
  source: 'look Ranges { first: Nat Interval := 0..10; second: Interval with Nat := 0..10 }'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Both spellings apply the same builtin arity-one Interval constructor and preserve ordinary endpoint
    constraints.
- id: generic-variance-readable
  rules:
  - MUD-TYPE-018
  source: 'alias Box with T { value: T }'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Only proven read/output occurrences admit covariance; Box application identity still includes exact
    arguments.
- id: generic-variance-consuming
  rules:
  - MUD-TYPE-018
  source: alias Consumer with T := T.rule()
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: T occurs only in a readonly callable receiver/input position, giving contravariance when all other contract
    obligations are proved.
- id: generic-variance-writable-invariant
  rules:
  - MUD-TYPE-018
  source: 'abstract thing Store with T { mut items: T [*] = empty }'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Full-contract reads and writes force invariance, even though a read-only generic wrapper could be covariant.
- id: generic-variance-phantom-invariant
  rules:
  - MUD-TYPE-018
  source: family Slot with T { Empty, Full }
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: No directional proof exists for phantom T; its variance is invariant and different arguments retain
    different identities.
- id: generic-finite-recursion
  rules:
  - MUD-TYPE-019
  source: 'alias Node with T { value: T; next: T Node [0..1] }'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: The recursive application is Node(T), closing a finite graph. Optional next separately supplies a finite
    value witness.
- id: generic-finite-permutation
  rules:
  - MUD-TYPE-019
  source: 'alias Swap with A, B { next: (B, A) Swap [0..1] }'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Reachable application patterns alternate Swap(A,B) and Swap(B,A); closure is finite without erasing
    exact arguments.
- id: generic-growing-instantiation
  rules:
  - MUD-TYPE-019
  source: 'alias List with T := T [* ordered]

    alias Growing with T { next: Growing with (List with T) [0..1] }'
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Repeated substitution generates Growing(T), Growing(List(T)), Growing(List(List(T))) and so on. Optional
