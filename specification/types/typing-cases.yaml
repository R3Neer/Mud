- id: unbounded-integer-addition
  rules:
  - MUD-TYPE-015
  source: 'result: Int = large + one'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: large is Int 9223372036854775807 and one is Int 1. The result is 9223372036854775808
