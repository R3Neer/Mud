- id: structural-equality-calculated-body
  rules:
  - MUD-TYPE-020
  source: 'alias A { x: Nat := 1 }

    alias B { x: Nat := 2 }

    A === B'
  source_scope: representation-judgement-fragment
  expected: static-accept
  contract: This is an exact equality judgement on supplied normalized contracts, not standalone programme acceptance.
    Bodies differ but complete calculated contracts agree.
  witness:
    kind: structural-equality
    nodes:
      Nat:
        kind: primitive
        identity: type::Nat
      A:
        kind: alias
        identity: alias::A
        children:
        - RA
      B:
        kind: alias
        identity: alias::B
        children:
        - RB
      RA:
        kind: record
        children:
        - FA
      RB:
        kind: record
        children:
        - FB
      FA:
        kind: field
        contract:
          name: x
          storage: calculated
          card:
          - 1
          - 1
        children:
        - Nat
        body: '1'
      FB:
        kind: field
        contract:
          name: x
          storage: calculated
          card:
          - 1
          - 1
        children:
        - Nat
        body: '2'
    left: A
    right: B
- id: structural-equality-member-kind
  rules:
  - MUD-TYPE-020
  source: 'alias A { x: Nat := 1 }

    alias B { x: Nat }

    A !== B'
  source_scope: representation-judgement-fragment
  expected: static-accept
  contract: 'The normalized inequality judgement holds: calculated x differs from component x, despite equal names/types.'
  witness:
    kind: structural-equality
    nodes:
      A:
        children:
        - RA
        identity: alias::A
        kind: alias
      B:
        children:
        - RB
        identity: alias::B
        kind: alias
      FA:
        body: '1'
        children:
        - Nat
        contract:
          card:
          - 1
          - 1
          name: x
          storage: calculated
        kind: field
      FB:
        body: '2'
        children:
        - Nat
        contract:
          card:
          - 1
          - 1
          name: x
          storage: component
        kind: field
      Nat:
        identity: type::Nat
        kind: primitive
      RA:
        children:
        - FA
        kind: record
      RB:
        children:
        - FB
        kind: record
    left: A
    right: B
    negated: true
- id: structural-equality-applied-family-opaque
  rules:
  - MUD-TYPE-020
  source: Cat Slot !== Dog Slot
  source_scope: representation-judgement-fragment
  expected: static-accept
  contract: The inequality judgement retains exact arguments of an opaque family constructor, including phantom
    arguments.
  witness:
    kind: structural-equality
    nodes:
      CatSlot:
        kind: family
        identity: family::Slot
        arguments:
        - thing::Cat
      DogSlot:
        kind: family
        identity: family::Slot
        arguments:
        - thing::Dog
    left: CatSlot
    right: DogSlot
    negated: true
