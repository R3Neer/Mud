- id: money-magnitude-coordinate-scaling
  rules:
  - MUD-TYPE-015
  source: total := pricePerMass * mass
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: pricePerMass has the nominal dimensions Cost/Weight with Money coordinates;
    mass has Weight dimensions with Num coordinates. Product dimensions reduce to
