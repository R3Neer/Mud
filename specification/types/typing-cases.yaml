- id: nominal-hir-stays-untyped
  rules:
  - MUD-TYPE-001
  source: actor.Play()
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Nominal HIR retains candidates; elaboration selects/checks the receiver target without adding
    typed fields to nominal HIR.
- id: producer-identity
  rules:
  - MUD-TYPE-003
  source: a := actor.Stats(); b := actor.Summary()
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Distinct producers retain distinct static nominal result types despite identical field contents.
- id: ambiguous-join-retains-union
  rules:
  - MUD-TYPE-008
  source: result := selected.Stats()
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Under multiple incomparable common result minima, the inferred type retains the original union.
- id: named-call-needs-static-names
  rules:
  - MUD-TYPE-007
  source: operation(actor = person)
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Under an erased callable contract with actor/hero alternatives, named binding is not statically
    unequivocal.
- id: explicit-field-initializer
  rules:
  - MUD-EFFECT-004
  source: 'thing Counter { mut value: Nat = 0 }'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: A new stored field supplies an explicit valid initialiser; runtime does not change its schema.
- id: private-value-mutation
  rules:
  - MUD-EFFECT-003
  source: '{ mut count: Nat = 0; count += 1; count }'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: A value owner admits mutation of its own private stored local.
- id: captured-value-write
  rules:
  - MUD-EFFECT-002
  - MUD-EFFECT-003
  source: '{ captured.value += 1; captured.value }'
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: A value owner cannot write captured world state even if the receiver carries inner authority.
- id: residual-symbolic-key-overlap
  rules:
  - MUD-EFFECT-006
  source: 'then dict[first] = a

    then dict[second] = b'
  source_scope: independent-concurrent-block-fragments
  expected: runtime-check
  contract: These fragments belong to independently triggered blocks reading one common view. Their complete
    existing-key replacements have proved safe cardinality; unresolved same-key different-value overlap is
    checked at consolidation, not resolved by textual order.
- id: char-context
  rules:
  - MUD-TYPE-009
  source: 'letter: Char = "a"'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: One decoded scalar receives Char context; context-free "a" remains Text.
- id: exact-division
  rules:
  - MUD-TYPE-011
  source: 'quotient: Num := 1 / 3'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Exact division produces Num without integer truncation.
- id: unrestricted-lifting
  rules:
  - MUD-TYPE-011
  source: left + right
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Both operand contracts have upper cardinality greater than one; no implicit zip/Cartesian product
