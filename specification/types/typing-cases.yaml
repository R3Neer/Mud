- id: recursive-constructor-domain-separation
  rules:
  - MUD-TYPE-016
  source: 'value: Node = leaf'
  source_scope: fragment-with-stated-contract
  expected: static-accept
  contract: Node is a productive recursive alias with optional children, leaf is a
