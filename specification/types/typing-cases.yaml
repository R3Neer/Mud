  rules:
  - MUD-TYPE-020
  source: Cat Slot.Empty === Dog Slot.Empty
  source_scope: fragment-with-stated-contract
  expected: static-reject
  contract: Members are values, not Type operands; comparing their reflected types is admitted instead.
- id: structural-equality-symbolic-domains
  rules:
  - MUD-TYPE-020
  source: Nat in (ActiveIds) !== Nat in (OtherIds)
  source_scope: fragment-with-stated-contract
  expected: static-accept
