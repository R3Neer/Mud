  source: "thing UnorderedFilter {\n    mut budget: Int = 1\n    items: Int [2] = [1, 1]\n}\naction SpendUnordered {\n    then for each value in UnorderedFilter.items if UnorderedFilter.budget > 0:\n        UnorderedFilter.budget -= 1\n}\n"
  cst_root: MudFileSyntax
  ast: ForEachEffect(filter=ExpressionBlock([], ...), ...)
  semantic_expectations:
  - source-membership-captured-at-loop-start
  - all-filters-read-the-same-initial-snapshot
  - both-iterations-are-accepted-before-delta-consolidation
  produces_ast: true
- id: d088-remaining-quantifiers-with-by
  category: expression
  source: "thing Quantified {\n    any := exists value in [1..10] by 2: value > 5\n    every := forall value in [1..10] by 2: value > 0\n    smallest := min value in [1..10] by 2: value\n    largest := max value in [1..10] by 2: value\n}\n"
  cst_root: MudFileSyntax
  ast: QuantifierExpr(Exists, step=2); QuantifierExpr(ForAll, step=2); QuantifierExpr(Minimum, step=2); QuantifierExpr(Maximum, step=2)
  produces_ast: true
- id: d088-open-lower-positive-step
  category: runtime
  source: "action OpenLower for mut total: Num {\n    then for each value in (1..8] by 2:\n        total += value\n}\n"
  cst_root: MudFileSyntax
  semantic_expectations:
  - visited-values-are-3-5-7
  produces_ast: true
- id: d088-open-upper-negative-step
  category: runtime
  source: "action OpenUpper for mut total: Num {\n    then for each value in [1..8) by -2:\n        total += value\n}\n"
  cst_root: MudFileSyntax
  semantic_expectations:
  - visited-values-are-6-4-2
  produces_ast: true
- id: d088-empty-inverted-interval-zero-iterations
  category: runtime
  source: "action EmptyLoop for mut total: Num {\n    then for each value in [8..1] by -1:\n        total += value\n}\n"
  cst_root: MudFileSyntax
  semantic_expectations:
  - interval-normalizes-to-empty
  - loop-performs-zero-iterations
  produces_ast: true
- id: d088-step-cannot-see-iteration-binding
  category: validation-after-resolution
  source: "action Broken for mut total: Num {\n    then for each value in [1..8] by value:\n        total += value\n}\n"
  cst_root: MudFileSyntax
  ast: ForEachEffect(binding=value, step=DottedPathExpr(value), ...)
  expected_diagnostics:
  - iteration-binding-not-visible-in-step
  semantic_expectations:
  - source-and-step-resolve-before-iteration-binding
  produces_ast: true
- id: d088-filter-local-not-visible-in-body
  category: validation-after-resolution
  source: "action Broken for values: Int [*], mut total: Int {\n    then for each value in values if {\n        adjusted := value + 1\n        adjusted > 0\n    }:\n        total += adjusted\n}\n"
  cst_root: MudFileSyntax
  ast: ForEachEffect(binding=value, filter=ExpressionBlock(locals=[adjusted], result=...), body=EffectBlock(...))
  expected_diagnostics:
  - filter-local-not-visible-in-loop-body
  semantic_expectations:
  - filter-expression-block-scope-ends-before-effect-body
  produces_ast: true
- id: d088-selection-binding-visible-in-expression-block
  category: expression
  source: "thing Sample {\n    values: Int [*]\n    selected := value in values: {\n        adjusted := value + 1\n        adjusted > 0\n    }\n}\n"
  cst_root: MudFileSyntax
  ast: SelectionExpr(binding=value, source=values, predicate=ExpressionBlock(locals=[adjusted], result=...))
  semantic_expectations:
  - selection-binding-visible-to-expression-block-locals-and-result
  produces_ast: true
- id: family-data-metadata
  category: family
  source: "family Terrain {\n    movementCost: Nat = 1 {\n        ~summary = \"Coste base\"\n    }\n    costly: Bool := movementCost >= 3 {\n        ~summary = \"Costoso\"\n    }\n\n    Plain,\n    Mountain {\n        movementCost = 4\n    }\n}\n"
  cst_root: MudFileSyntax
  ast: FamilyDecl(data=[StoredFamilyDataDecl(movementCost, metadata=[StoredMetadataAssignment(summary)]), CalculatedFamilyDataDecl(costly, shape=ExplicitDerivedShape(Bool), metadata=[StoredMetadataAssignment(summary)])])
  normalizations:
  - family-data-metadata-belongs-to-schema-descriptor
  produces_ast: true
- id: family-data-override-metadata-rejected
  category: validation-before-ast
  source: "family Terrain {\n    movementCost: Nat = 1\n\n    Plain,\n    Mountain {\n        movementCost = 4 {\n            ~summary = \"solo aquí\"\n        }\n    }\n}\n"
  cst_root: MudFileSyntax
  expected_diagnostics:
  - family-data-assignment-cannot-have-metadata
  produces_ast: false
- id: metadata-signature-supported-absent
  category: typing-after-ast
  source: "thing Seed\naction Spawn {\n    then create Seed\n}\nrule EmptySignatureCheck {\n    Spawn~for == empty and Spawn~given == empty\n}\n"
  cst_root: MudFileSyntax
  ast: BooleanRuleDecl(condition=BinaryExpr(MetadataAccessExpr(Spawn, for) == empty, WordAnd, MetadataAccessExpr(Spawn, given) == empty))
  semantic_expectations:
  - action-without-for-yields-empty-for
  - action-without-given-yields-empty-given
  produces_ast: true
- id: metadata-signature-unsupported-receiver
  category: typing-after-ast
  source: "thing Seed\nrule InvalidSignatureReflection {\n    Seed~for == empty\n}\n"
  cst_root: MudFileSyntax
  ast: BooleanRuleDecl(condition=ComparisonChainExpr(MetadataAccessExpr(Seed, for), Equal, empty))
  expected_diagnostics:
  - metadata-property-not-supported-by-static-receiver
  produces_ast: true
- id: duplicate-decision-branch-canonical-selector
