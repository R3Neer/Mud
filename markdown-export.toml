[export]
root = "."
output_dir = "exports"
default_profile = "current"
source_languages = { ebnf = "ebnf", asdl = "asdl", yaml = "yaml" }
exclude = [
    "exports/**",
    "**/node_modules/**",
]

[profiles.specification]
title = "Formal specification"
include = ["specification"]
follow_links = false
strip_frontmatter = true
source_markers = true
strict_links = false
max_chars = 0

[profiles.decisions]
title = "Decisions and question history"
include = [
    "notes/questions/*.md",
    "notes/decisions/*.md",
]
follow_links = false
strip_frontmatter = true
source_markers = true
strict_links = false
max_chars = 0

[profiles.language]
title = "Current language semantics"
include = [
    "specification",
    "notes/vision-y-alcance.md",
    "notes/decisions/*.md",
    "notes/questions/*.md",
]
exclude = [
    "notes/decisions/ADR-053-operador-semantico-y-flujo-de-autoria.md",
    "notes/questions/Q-001-gramatica-y-saltos-de-linea.md",
    "notes/questions/Q-004-rollback-de-rejected.md",
    "notes/questions/Q-010-estado-de-las-decisiones-de-la-fuente.md",
