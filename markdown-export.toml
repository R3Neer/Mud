[export]
root = "."
output_dir = "exports"
default_profile = "current"
source_languages = { ebnf = "ebnf", asdl = "asdl", yaml = "yaml" }
exclude = [
    "exports/**",
    "**/node_modules/**",
]

[profiles.specification]
title = "Formal specification"
include = ["specification"]
follow_links = false
strip_frontmatter = true
source_markers = true
strict_links = false
max_chars = 0

[profiles.decisions]
title = "Decisions and question history"
include = [
    "notes/questions/*.md",
    "notes/decisions/*.md",
]
follow_links = false
strip_frontmatter = true
source_markers = true
strict_links = false
max_chars = 0

[profiles.language]
title = "Current language semantics"
include = [
    "specification",
    "notes/vision-and-scope.md",
    "notes/decisions/*.md",
    "notes/questions/*.md",
]
exclude = [
    "notes/decisions/ADR-053-semantic-operator-and-authoring-flow.md",
    "notes/questions/Q-001-g-grammar-and-line-breaks.md",
    "notes/questions/Q-004-r-rollback-of-rejected.md",
    "notes/questions/Q-010-e-state-of-source-decisions.md",
    "notes/questions/Q-011-v-named-participant-binding.md",
    "notes/questions/Q-012-v-named-given-values.md",
    "notes/questions/Q-013-r-relational-constraints-between-on-participants.md",
    "notes/questions/Q-024-d-data-associated-with-family-members.md",
    "notes/questions/Q-025-d-destruction-of-static-thing-values.md",
    "notes/questions/Q-041-o-thing-ontology.md",
    "notes/questions/Q-042-e-specialisation-from-a-concrete-thing.md",
    "notes/questions/Q-043-c-specialisation-cycles.md",
    "notes/questions/Q-044-i-identity-and-references-to-future-thing-values.md",
