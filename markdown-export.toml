    "notes/questions/Q-054-c-catalogue-and-lexical-resolution-of-units-and-prefixes.md",
    "notes/questions/Q-055-l-point-magnitude-literals.md",
]
follow_links = false
strip_frontmatter = true
source_markers = true
strict_links = false
max_chars = 0

[profiles.current]
