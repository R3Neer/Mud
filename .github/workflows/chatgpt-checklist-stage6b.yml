name: ChatGPT checklist authority index
on:
  push:
    branches: [chatgpt-checklist-finish-stage6b-runner]
permissions:
  contents: write
jobs:
  index:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-finish-stage6b-runner
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-finish-v1
          path: target
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify base
        shell: pwsh
        working-directory: target
        env:
          EXPECTED: 11461e5ca98e2fa350ba279f884b4b3a603a3608
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED) { throw 'candidate moved before index fix' }
          if (git status --porcelain=v1 --untracked-files=all) { throw 'candidate checkout dirty' }
      - name: Apply index fix
        shell: pwsh
        env:
          MUD_TARGET: ${{ github.workspace }}\target
        run: python control/.chatgpt/stage6b_index.py
      - name: Validate
        shell: pwsh
        working-directory: target
        run: |
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          @'
          from pathlib import Path
          s=Path('especificacion/README.md').read_text(encoding='utf-8')
          if 'anclas estables de ramas decisionales' in s: raise SystemExit('stale branch-anchor wording remains')
          if 'no reciben ancla pública conforme a D-090' not in s: raise SystemExit('D-090 branch identity missing')
          print('STAGE6B_AUDIT_OK')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Commit and push
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add especificacion/README.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git commit -m "docs(spec): alinea indice de anclas con D-090"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git push origin HEAD:chatgpt-checklist-finish-v1
          if ($LASTEXITCODE -ne 0) { exit 1 }
