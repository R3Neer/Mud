name: ChatGPT global coherence phase 2f lexical
on:
  push:
    branches: [chatgpt-global-coherence-runner-v2f]
permissions:
  contents: write
jobs:
  lexical:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-runner-v2f, path: runner, fetch-depth: 0}
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-20260816-v3, path: target, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Base exacta
        shell: pwsh
        working-directory: target
        env: {BASE: 6d2d52e351f80f368ae123b55f07d81b34012bff}
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:BASE) { throw 'base mismatch' }
          if (git status --porcelain=v1 --untracked-files=all) { throw 'dirty base' }
      - name: Transformación
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force tooling/chatgpt | Out-Null
          Copy-Item ../runner/tooling/chatgpt/global_coherence_phase2_lexical.py tooling/chatgpt/a.py
          Copy-Item ../runner/tooling/chatgpt/global_coherence_phase2_syntax_kinds.py tooling/chatgpt/b.py
          Copy-Item ../runner/tooling/chatgpt/global_coherence_phase2_human_review.py tooling/chatgpt/c.py
          python tooling/chatgpt/a.py; if($LASTEXITCODE){throw 'phase2'}
          python tooling/chatgpt/b.py; if($LASTEXITCODE){throw 'kinds'}
          python tooling/chatgpt/c.py; if($LASTEXITCODE){throw 'review'}
          Remove-Item tooling/chatgpt/a.py,tooling/chatgpt/b.py,tooling/chatgpt/c.py
          python tooling/decisions/manage_decisions.py generate; if($LASTEXITCODE){throw 'decisions generate'}
          python tooling/questions/validate_questions.py generate; if($LASTEXITCODE){throw 'questions generate'}
      - name: Invariantes
        shell: pwsh
        working-directory: target
        run: |
          @'
          from pathlib import Path
          def r(p): return Path(p).read_text(encoding='utf-8')
          lex=r('especificacion/gramatica/mud-lexico.ebnf'); kinds=r('especificacion/sintaxis/mud-syntax-kinds.yaml')
          for x in ('point-form\n    ::=','unit-form\n    ::='):
              assert x not in lex, x
          for x in ('| point-form','| unit-form','    - point-form\n','    - unit-form\n','  point-form:\n','  unit-form:\n'):
              assert x not in kinds, x
          s=r('especificacion/06-lexico.md')
          for x in ('El lexer representa una coincidencia válida como `POINT_LITERAL`.','Si declara `format`','sin `format` usa una cantidad'):
              assert x not in s, x
          d=r('notas/decisiones/ADR-062-literales-canonicos-de-magnitudes-de-punto.md')
          for x in ('La propiedad `format`','Un `format` de punto','dentro del `format`','- `format` es simultáneamente'):
              assert x not in d, x
          assert 'MUD-LEX-015' in s
          assert 'resolved: true' in r('notas/preguntas/Q-054-catalogo-y-resolucion-lexica-de-unidades-y-prefijos.md')
          assert 'resolved: true' in r('notas/preguntas/Q-055-literales-de-magnitudes-de-punto.md')
          print('PHASE2F_INVARIANTS_OK')
          '@ | python -
          if($LASTEXITCODE){throw 'invariants'}
      - name: Validadores
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          python tooling/decisions/manage_decisions.py validate; if($LASTEXITCODE){throw 'decisions'}
          python tooling/questions/validate_questions.py; if($LASTEXITCODE){throw 'questions'}
          python especificacion/gramatica/validate_grammar.py; if($LASTEXITCODE){throw 'grammar'}
          python especificacion/sintaxis/validate_syntax_model.py; if($LASTEXITCODE){throw 'syntax'}
          git diff --check; if($LASTEXITCODE){throw 'diff'}
      - name: Superficie
        shell: pwsh
        working-directory: target
        run: |
          $allowed=@('notas/decisiones/ADR-089-clasificacion-contextual-de-formas-fuente.md','notas/decisiones/ADR-062-literales-canonicos-de-magnitudes-de-punto.md','notas/decisiones/ADR-076-unidades-nombradas-prefijos-y-escritura-adyacente.md','notas/decisiones/README.md','notas/preguntas/Q-054-catalogo-y-resolucion-lexica-de-unidades-y-prefijos.md','notas/preguntas/Q-055-literales-de-magnitudes-de-punto.md','notas/preguntas/README.md','especificacion/06-lexico.md','especificacion/gramatica/mud-lexico.ebnf','especificacion/sintaxis/mud-syntax-kinds.yaml','tooling/markdown_export/profiles.toml')
          $actual=@(git status --porcelain=v1 --untracked-files=all | % {$p=$_.Substring(3);if($p -match ' -> '){$p=($p -split ' -> ',2)[1]};$p.Trim('"')})|Sort-Object -Unique
          foreach($p in $actual){if($allowed -notcontains $p){throw "unexpected $p"}}
          git diff --stat
      - name: Commit candidato
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          git config user.name ChatGPT; git config user.email chatgpt@users.noreply.github.com
          git add --all; git diff --cached --check; if($LASTEXITCODE){throw 'staged diff'}
          git commit -m "spec(lexicon): separa scanner base de formas contextuales" -m "D-089 elimina la dependencia circular de UNIT_FORM/POINT_LITERAL y cierra Q-054/Q-055 con evidencia.`n`nValidation: invariantes, decisiones, preguntas, gramática, sintaxis y diff check."; if($LASTEXITCODE){throw 'commit'}
          git push origin HEAD:chatgpt-global-coherence-20260816-v3; if($LASTEXITCODE){throw 'push'}
