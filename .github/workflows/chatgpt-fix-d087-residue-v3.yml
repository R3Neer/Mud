name: ChatGPT fix D087 remaining prose residue

on:
  push:
    branches:
      - chatgpt-fix-d087-residue-runner-v3

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-fix-d087-residue-candidate-v3
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Apply exact residue cleanup
        shell: pwsh
        env:
          BASE: 1314cfda3e3390926e2736b656a9538100bc8360
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:BASE) { throw 'base mismatch' }
          if (git status --porcelain=v1 --untracked-files=all) { throw 'dirty base' }
          @'
          from pathlib import Path
          edits = {
            'notas/decisiones/ADR-070-cst-sin-perdidas-y-ast-superficial-normalizado.md': [
              ('- Modificada por: [[ADR-086-identidad-nominal-exacta-y-algebra-de-diccionarios|D-086]]\n', '- Modificada por: [[ADR-086-identidad-nominal-exacta-y-algebra-de-diccionarios|D-086]]\n- Ampliada por: [[ADR-087-metadatos-reflectivos-descriptores-estables-y-visibilidad-exterior|D-087]]\n'),
              ('- Propiedades de unidad duplicadas.', '- Declaraciones de metadatos duplicadas en un mismo propietario, incluidas las unidades.'),
            ],
            'especificacion/08-sintaxis-abstracta.md': [
              ('- Unidad con propiedades duplicadas.', '- Declaraciones de metadatos duplicadas en una misma unidad.'),
            ],
          }
          for rel, replacements in edits.items():
            p=Path(rel); t=p.read_text(encoding='utf-8')
            for old,new in replacements:
              if t.count(old)!=1: raise SystemExit(f'{rel}: expected {old!r} once, found {t.count(old)}')
              t=t.replace(old,new,1)
            p.write_text(t,encoding='utf-8',newline='\n')
          '@ | python -
      - name: Stage 1 targeted audit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          d70=Path('notas/decisiones/ADR-070-cst-sin-perdidas-y-ast-superficial-normalizado.md').read_text(encoding='utf-8')
          ast=Path('especificacion/08-sintaxis-abstracta.md').read_text(encoding='utf-8')
          if 'ADR-087-metadatos-reflectivos-descriptores-estables-y-visibilidad-exterior|D-087' not in d70: raise SystemExit('D070 lacks D087 traceability')
          for text in (d70,ast):
            if 'Propiedades de unidad duplicadas' in text or 'Unidad con propiedades duplicadas' in text: raise SystemExit('stale unit-property wording')
          if 'Declaraciones de metadatos duplicadas en una misma unidad.' not in ast: raise SystemExit('AST invariant wording missing')
          print('D087_RESIDUE_V3_TARGETED_OK')
          '@ | python -
      - name: Stage 2 official validators
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { throw 'decisions failed' }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { throw 'questions failed' }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { throw 'grammar failed' }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { throw 'syntax model failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
      - name: Stage 3 exact surface and commit
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $expected=@('especificacion/08-sintaxis-abstracta.md','notas/decisiones/ADR-070-cst-sin-perdidas-y-ast-superficial-normalizado.md') | Sort-Object
          $actual=@(git status --porcelain=v1 --untracked-files=all | ForEach-Object { $_.Substring(3).Trim('"') }) | Sort-Object
          if (Compare-Object $expected $actual) { Write-Host $actual; throw 'unexpected surface' }
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add --all
          git diff --cached --check
          git commit -m "fix(spec): alinea residuos documentales de D-087"
          git push origin HEAD:chatgpt-fix-d087-residue-candidate-v3
