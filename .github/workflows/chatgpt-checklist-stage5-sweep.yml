name: ChatGPT checklist ADR sweep
on:
  push:
    branches: [chatgpt-checklist-finish-stage5-runner]
permissions:
  contents: write
jobs:
  sweep:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-finish-stage5-runner
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-finish-v1
          path: target
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Verify stage base
        shell: pwsh
        working-directory: target
        env:
          EXPECTED: c20af8ed94459241168389ba3e9a39350b0f4bea
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:EXPECTED) { throw 'candidate moved before ADR sweep' }
          if (git status --porcelain=v1 --untracked-files=all) { throw 'candidate checkout dirty' }
      - name: Apply ADR sweep
        shell: pwsh
        env:
          MUD_TARGET: ${{ github.workspace }}\target
        run: |
          python control/.chatgpt/stage5_sweep_a.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python control/.chatgpt/stage5_sweep_b.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Validate
        shell: pwsh
        working-directory: target
        run: |
          python tooling/decisions/manage_decisions.py generate
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          @'
          from pathlib import Path
          root=Path('.')
          checks={
            'notas/decisiones/ADR-021-ciclo-de-vida-logico-y-suspension.md': [('things {','present'),('rules {','present')],
            'notas/decisiones/ADR-028-sistema-de-magnitudes-y-unidades.md': [('~abbreviation =','present'),('\n        abbreviation =','absent')],
            'notas/decisiones/ADR-029-intervalos-estrellas-y-ciclos.md': [('~format =','present'),('\n    format =','absent')],
            'notas/decisiones/ADR-035-organizacion-nombres-using-y-anclas.md': [('anchor{','absent'),('expression~anchor','present')],
            'notas/decisiones/ADR-036-participantes-receptores-y-llamadas.md': [('puede omitirse','absent'),('debe declarar un identificador fuente explícito','present')],
            'notas/decisiones/ADR-037-campos-y-dominios-declarativos.md': [('omitir cardinalidad equivale a `[1]`','absent'),('campo ordinario llamado `name`','present')],
            'notas/decisiones/ADR-039-colecciones-y-diccionarios.md': [('`unique`, cuando se escribe, se aplica a los **valores asociados**','present'),('Leer una clave ausente produce `empty`','present')],
            'notas/decisiones/ADR-054-definiciones-canonicas-y-activacion-inicial.md': [('No existe la forma plana o mezclada','present')],
            'notas/decisiones/ADR-055-tests-declarativos-y-diagnosticos-otherwise.md': [('things { Counter }','present'),('test-start-with\n    ::= start-with-declaration','present')],
            'notas/decisiones/ADR-061-resultados-fallidos-y-plantillas-text.md': [('anchor{','absent'),('~format =','present'),('expression~anchor','present')],
            'notas/decisiones/ADR-063-firmas-given-y-vinculaciones-on-conjuntas.md': [('puede ser anónimo','absent'),('Todo rol `for` tiene identificador fuente explícito','present')],
            'notas/decisiones/ADR-068-thing-universal-y-nombre-intrinseco.md': [('anchor{','absent'),('### Metadato estándar `~name`','present')],
            'notas/decisiones/ADR-092-disponibilidad-estatica-de-propiedades-reflectivas.md': [('`~anchor`, `~path` y `~file`','present')],
          }
          for p,rules in checks.items():
              s=(root/p).read_text(encoding='utf-8')
              for needle,mode in rules:
                  if (needle in s) != (mode=='present'):
                      raise SystemExit(f'{p}: {mode} check failed for {needle!r}')
          print('STAGE5_TARGETED_AUDIT_OK')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Commit and push
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add --all
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git commit -m "docs(adr): actualiza decisiones vigentes a contratos actuales"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git push origin HEAD:chatgpt-checklist-finish-v1
          if ($LASTEXITCODE -ne 0) { exit 1 }
