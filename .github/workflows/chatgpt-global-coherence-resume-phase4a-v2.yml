name: ChatGPT global coherence resume phase 4a v2
on:
  push:
    branches: [chatgpt-global-coherence-resume-runner-b]
permissions: {contents: write}
jobs:
  contextual-nominal:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-resume-runner-b, path: runner, fetch-depth: 0}
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-resume-20260816-b, path: target, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Base exacta
        shell: pwsh
        working-directory: target
        env: {BASE: 3ada845fccf190f88bea22f4ea366af01d233921}
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:BASE){throw 'base mismatch'}
          if(git status --porcelain=v1 --untracked-files=all){throw 'dirty base'}
      - name: Transformación
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force tooling/chatgpt | Out-Null
          Copy-Item ../runner/tooling/chatgpt/resume_phase4a_contextual_nominal_v2.py tooling/chatgpt/x.py
          python tooling/chatgpt/x.py; if($LASTEXITCODE){throw 'transform'}
          Remove-Item tooling/chatgpt/x.py
      - name: Invariantes
        shell: pwsh
        working-directory: target
        run: |
          @'
          from pathlib import Path
          def r(p): return Path(p).read_text(encoding='utf-8')
          d=r('notas/decisiones/ADR-032-construccion-contextual-y-casting-nominal.md')
          assert 'ContextualNominalConstructionExpr(literal, target_type)' in d
          assert 'una conversión escrita con `to` produce `ConversionExpr(value, target_type)`' in d
          a=r('especificacion/sintaxis/mud-resolved-ast.asdl')
          assert a.count('ContextualNominalConstructionExpr') == 1
          assert 'Contrato del AST semántico resuelto' in a
          assert 'no representa la instantánea temprana de name lookup' in a
          s=r('especificacion/08-sintaxis-abstracta.md')
          assert 'resolución nominal (símbolos + grafo parcial)' in s
          assert 'tipado, elaboración y análisis estático' in s
          assert 'La construcción contextual solo puede materializar un literal' in s
          n=r('especificacion/09-nombres-y-anclas.md')
          assert 'no obligan a materializar un AST canónico distinto' in n
          assert 'Esta frontera nominal temprana se representa mediante símbolos y el grafo parcial' in n
          rd=r('especificacion/sintaxis/README.md')
          assert 'AST semántico resuelto' in rd and 'resolución nominal (símbolos + grafo parcial)' in rd
          c=r('especificacion/sintaxis/casos/cst-ast.yaml')
          for case in ('contextual-nominal-basic','contextual-nominal-structural','explicit-nominal-cast-distinct-from-context'):
              assert f'id: {case}' in c
          print('PHASE4A_V2_INVARIANTS_OK')
          '@ | python -
          if($LASTEXITCODE){throw 'invariants'}
      - name: Validadores
        shell: pwsh
        working-directory: target
        run: |
          python tooling/decisions/manage_decisions.py validate; if($LASTEXITCODE){throw 'decisions'}
          python tooling/questions/validate_questions.py; if($LASTEXITCODE){throw 'questions'}
          python especificacion/gramatica/validate_grammar.py; if($LASTEXITCODE){throw 'grammar'}
          python especificacion/sintaxis/validate_syntax_model.py; if($LASTEXITCODE){throw 'syntax'}
          git diff --check; if($LASTEXITCODE){throw 'diff'}
      - name: Superficie
        shell: pwsh
        working-directory: target
        run: |
          $allowed=@('notas/decisiones/ADR-032-construccion-contextual-y-casting-nominal.md','especificacion/08-sintaxis-abstracta.md','especificacion/09-nombres-y-anclas.md','especificacion/sintaxis/README.md','especificacion/sintaxis/mud-resolved-ast.asdl','especificacion/sintaxis/casos/cst-ast.yaml')
          $actual=@(git status --porcelain=v1 --untracked-files=all|%{$p=$_.Substring(3);if($p -match ' -> '){$p=($p -split ' -> ',2)[1]};$p.Trim('"')})|Sort-Object -Unique
          foreach($p in $actual){if($allowed -notcontains $p){throw "unexpected $p"}}
          if($actual.Count -ne $allowed.Count){throw "changed-path count mismatch: $($actual.Count)"}
          foreach($p in $allowed){if($actual -notcontains $p){throw "missing expected change $p"}}
          git diff --stat
      - name: Commit candidato
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add --all
          git diff --cached --check; if($LASTEXITCODE){throw 'staged diff'}
          git commit -m "fix(types): alinea AST resuelto y construcción contextual" -m "Aclara que la resolución nominal temprana produce símbolos y grafo parcial, mientras mud-resolved-ast representa la forma semántica completada tras tipado y elaboración. Sobre esa frontera, D-032 conserva la construcción nominal contextual separada del cast explícito con to.`n`nValidation: invariantes específicas, decisiones, preguntas, gramática, sintaxis y git diff --check."; if($LASTEXITCODE){throw 'commit'}
          git push origin HEAD:chatgpt-global-coherence-resume-20260816-b; if($LASTEXITCODE){throw 'push'}
