name: ChatGPT checklist AST IR

on:
  push:
    branches:
      - chatgpt-checklist-runner-ast-v2

permissions:
  contents: write

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-runner-ast-v2
          path: control
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-candidate
          path: target
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install validation dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Verify base
        shell: pwsh
        env:
          EXPECTED_HEAD: 7bdab1be3504d12be88f40adc284686b920c4412
        run: |
          $ErrorActionPreference = 'Stop'
          $h = (git -C target rev-parse HEAD).Trim()
          if ($h -ne $env:EXPECTED_HEAD) { throw "candidate base mismatch: $h" }
          if (git -C target status --porcelain=v1 --untracked-files=all) { throw 'candidate not clean' }
      - name: Apply architecture transform
        shell: pwsh
        run: |
          python control/.chatgpt/transform_ast.py target
          if ($LASTEXITCODE -ne 0) { throw 'transform failed' }
          python control/.chatgpt/fix_ast_review.py target
          if ($LASTEXITCODE -ne 0) { throw 'review fix failed' }
      - name: Regenerate decision index
        shell: pwsh
        working-directory: target
        run: |
          python tooling/decisions/manage_decisions.py generate
          if ($LASTEXITCODE -ne 0) { throw 'decision generation failed' }
      - name: Architecture invariants
        shell: pwsh
        run: |
          python control/.chatgpt/audit_ast.py target
          if ($LASTEXITCODE -ne 0) { throw 'architecture audit failed' }
          @'
          from pathlib import Path
          import sys
          root=Path('target')
          d=(root/'notas/decisiones/ADR-078-resolucion-nominal-anclas-y-grafo-inicial.md').read_text(encoding='utf-8')
          if 'resolución, AST resuelto,' in d: raise SystemExit('stale D078 affects')
          print('AST_HUMAN_REVIEW_REGRESSION_OK')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'review regression failed' }
      - name: Repository validators
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { throw 'decision validation failed' }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { throw 'question validation failed' }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { throw 'grammar validation failed' }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { throw 'syntax validation failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
      - name: Verify exact surface
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'especificacion/09-nombres-y-anclas.md',
            'especificacion/ir/README.md',
            'especificacion/ir/mud-semantic-ir.asdl',
            'especificacion/sintaxis/README.md',
            'especificacion/sintaxis/mud-resolved-ast.asdl',
            'especificacion/sintaxis/validate_syntax_model.py',
            'notas/decisiones/ADR-051-grafo-semantico-e-ir-reconstruibles.md',
            'notas/decisiones/ADR-078-resolucion-nominal-anclas-y-grafo-inicial.md',
            'notas/decisiones/ADR-085-diccionarios-decisionales-metadatos-y-activacion-estructurada.md',
            'notas/decisiones/ADR-086-identidad-nominal-exacta-y-algebra-de-diccionarios.md',
            'notas/decisiones/ADR-090-ramas-funcionales-sin-ancla-publica.md',
            'notas/decisiones/ADR-091-datos-de-family-como-descriptores-anclados.md',
            'notas/decisiones/ADR-093-ast-superficial-unico-e-ir-semantico-elaborado.md',
            'notas/decisiones/README.md'
          ) | Sort-Object
          $actual = @(git status --porcelain=v1 --untracked-files=all | ForEach-Object { $_.Substring(3) }) | Sort-Object
          $delta = Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($delta) { $delta | Format-Table | Out-String | Write-Host; throw 'unexpected change surface' }
      - name: Commit candidate
        shell: pwsh
        working-directory: target
        run: |
          git config user.name 'ChatGPT'
          git config user.email 'chatgpt@users.noreply.github.com'
          git add --all
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'cached diff check failed' }
          git commit -m 'refactor(spec): separa AST superficial e IR semántico'
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:chatgpt-checklist-candidate
          if ($LASTEXITCODE -ne 0) { throw 'candidate push failed' }
