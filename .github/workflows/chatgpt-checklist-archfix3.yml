name: ChatGPT checklist architecture residues v3
on:
  push:
    branches: [chatgpt-checklist-runner-archfix3]
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-runner-archfix3
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-candidate
          path: target
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Verify base and apply
        shell: pwsh
        env: {EXPECTED_HEAD: 6703cec5368656cb84022ae533c1c2a0834f65d1}
        run: |
          $ErrorActionPreference='Stop'
          $h=(git -C target rev-parse HEAD).Trim()
          if ($h -ne $env:EXPECTED_HEAD) { throw "base mismatch: $h" }
          if (git -C target status --porcelain=v1 --untracked-files=all) { throw 'candidate not clean' }
          python control/.chatgpt/fix_arch_residues.py target
          if ($LASTEXITCODE -ne 0) { throw 'transform failed' }
      - name: Audit retired architecture terms
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          root=Path('target')
          offenders=[]
          for top in ('especificacion','notas'):
              for p in (root/top).rglob('*'):
                  if not p.is_file() or p.suffix not in {'.md','.yaml','.yml','.asdl','.py'}: continue
                  rel=p.relative_to(root).as_posix()
                  text=p.read_text(encoding='utf-8')
                  for n,line in enumerate(text.splitlines(),1):
                      if 'AST resuelto' not in line and 'mud-resolved-ast' not in line: continue
                      if rel=='notas/decisiones/ADR-093-ast-superficial-unico-e-ir-semantico-elaborado.md': continue
                      if rel=='especificacion/sintaxis/validate_syntax_model.py' and 'retired_resolved_ast_path' in line: continue
                      offenders.append(f'{rel}:{n}:{line}')
          if offenders:
              print(('\n'.join(offenders)).encode('ascii','backslashreplace').decode('ascii'))
              raise SystemExit('active retired architecture references remain')
          print('ARCH_RESIDUES_AUDIT_OK')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'architecture residue audit failed' }
      - name: Official validators
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { throw 'decisions' }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { throw 'questions' }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { throw 'grammar' }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { throw 'syntax' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff' }
      - name: Exact surface
        shell: pwsh
        working-directory: target
        run: |
          $expected=@(
            'especificacion/08-sintaxis-abstracta.md',
            'notas/decisiones/ADR-070-cst-sin-perdidas-y-ast-superficial-normalizado.md',
            'notas/decisiones/ADR-072-entornos-de-resolucion-y-migraciones-explicitas-de-anclas.md',
            'notas/decisiones/ADR-073-as-thing-explicito-redundante.md',
            'notas/decisiones/ADR-074-uniones-nominales-y-estrechamiento.md',
            'notas/decisiones/ADR-085-diccionarios-decisionales-metadatos-y-activacion-estructurada.md',
            'notas/decisiones/ADR-086-identidad-nominal-exacta-y-algebra-de-diccionarios.md',
            'notas/decisiones/ADR-087-metadatos-reflectivos-descriptores-estables-y-visibilidad-exterior.md'
          ) | Sort-Object
          $actual=@(git status --porcelain=v1 --untracked-files=all | ForEach-Object {$_.Substring(3)}) | Sort-Object
          $delta=Compare-Object -ReferenceObject $expected -DifferenceObject $actual
          if ($delta) { $delta | Format-Table | Out-String | Write-Host; throw 'unexpected surface' }
      - name: Commit
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add --all
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'cached diff' }
          git commit -m 'fix(spec): elimina referencias activas al AST resuelto'
          if ($LASTEXITCODE -ne 0) { throw 'commit' }
          git push origin HEAD:chatgpt-checklist-candidate
          if ($LASTEXITCODE -ne 0) { throw 'push' }
