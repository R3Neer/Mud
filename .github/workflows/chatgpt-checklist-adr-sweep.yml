name: ChatGPT checklist ADR sweep
on:
  push:
    branches: [chatgpt-checklist-runner-adr-sweep]
permissions: {contents: write}
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {ref: chatgpt-checklist-runner-adr-sweep, path: control, persist-credentials: false}
      - uses: actions/checkout@v6
        with: {ref: chatgpt-checklist-adr-sweep, path: target, fetch-depth: 0, persist-credentials: true}
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Verify base
        shell: pwsh
        env: {EXPECTED_HEAD: e117e86eebcf215af0f5e0c9cc1965f9277f03ef}
        run: |
          $h=(git -C target rev-parse HEAD).Trim()
          if($h -ne $env:EXPECTED_HEAD){throw "base mismatch: $h"}
          if(git -C target status --porcelain=v1 --untracked-files=all){throw 'dirty base'}
      - name: Transform
        shell: pwsh
        run: |
          python control/.chatgpt/transform_adr_sweep.py target
          if($LASTEXITCODE){throw 'transform'}
      - name: Invariants
        shell: pwsh
        working-directory: target
        run: |
          @'
          from pathlib import Path
          checks={
            'notas/decisiones/ADR-028-sistema-de-magnitudes-y-unidades.md': [('~prefixes',True),('        name = "meter"',False)],
            'notas/decisiones/ADR-029-intervalos-estrellas-y-ciclos.md': [('~format =',True),('    format =',False)],
            'notas/decisiones/ADR-035-organizacion-nombres-using-y-anclas.md': [('anchor{...',False),('expression~anchor',True)],
            'notas/decisiones/ADR-036-participantes-receptores-y-llamadas.md': [('puede omitirse',False),('Todo participante `for`, `on` y `given`',True)],
            'notas/decisiones/ADR-037-campos-y-dominios-declarativos.md': [('omitir cardinalidad equivale a `[1]`',False),('forma derivada',True)],
            'notas/decisiones/ADR-039-colecciones-y-diccionarios.md': [('predeterminado del tipo de valor',False),('produce `empty`',True)],
            'notas/decisiones/ADR-054-definiciones-canonicas-y-activacion-inicial.md': [('things {',True),('reglas no quedan activas por aparecer',True)],
            'notas/decisiones/ADR-055-tests-declarativos-y-diagnosticos-otherwise.md': [('things { ... }',True)],
            'notas/decisiones/ADR-061-resultados-fallidos-y-plantillas-text.md': [('anchor{...',False),('expression~anchor',True)],
            'notas/decisiones/ADR-063-firmas-given-y-vinculaciones-on-conjuntas.md': [('Un rol de cardinalidad exactamente `[1]` puede ser anónimo',False),('Todo rol `for` tiene identificador',True)],
            'notas/decisiones/ADR-068-thing-universal-y-nombre-intrinseco.md': [('### Propiedad intrínseca `name`',False),('### Metadato estándar `~name`',True)],
          }
          for p,tests in checks.items():
              s=Path(p).read_text(encoding='utf-8')
              for needle,want in tests:
                  if (needle in s)!=want: raise SystemExit(f'{p}: invariant failed {needle!r} expected {want}')
          print('ADR_SWEEP_AUDIT_OK')
          '@ | python -
          if($LASTEXITCODE){throw 'invariants'}
      - name: Validators
        shell: pwsh
        working-directory: target
        run: |
          python tooling/decisions/manage_decisions.py validate; if($LASTEXITCODE){throw 'decisions'}
          python tooling/questions/validate_questions.py; if($LASTEXITCODE){throw 'questions'}
          python especificacion/gramatica/validate_grammar.py; if($LASTEXITCODE){throw 'grammar'}
          python especificacion/sintaxis/validate_syntax_model.py; if($LASTEXITCODE){throw 'syntax'}
          git diff --check; if($LASTEXITCODE){throw 'diff'}
      - name: Surface
        shell: pwsh
        working-directory: target
        run: |
          $expected=@(
            'notas/decisiones/ADR-028-sistema-de-magnitudes-y-unidades.md','notas/decisiones/ADR-029-intervalos-estrellas-y-ciclos.md','notas/decisiones/ADR-035-organizacion-nombres-using-y-anclas.md','notas/decisiones/ADR-036-participantes-receptores-y-llamadas.md','notas/decisiones/ADR-037-campos-y-dominios-declarativos.md','notas/decisiones/ADR-039-colecciones-y-diccionarios.md','notas/decisiones/ADR-054-definiciones-canonicas-y-activacion-inicial.md','notas/decisiones/ADR-055-tests-declarativos-y-diagnosticos-otherwise.md','notas/decisiones/ADR-061-resultados-fallidos-y-plantillas-text.md','notas/decisiones/ADR-063-firmas-given-y-vinculaciones-on-conjuntas.md','notas/decisiones/ADR-068-thing-universal-y-nombre-intrinseco.md')|Sort-Object
          $actual=@(git status --porcelain=v1 --untracked-files=all|%{$_.Substring(3)})|Sort-Object
          $delta=Compare-Object $expected $actual
          if($delta){$delta|Format-Table|Out-String|Write-Host;throw 'unexpected surface'}
      - name: Commit
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add --all
          git diff --cached --check; if($LASTEXITCODE){throw 'cached diff'}
          git commit -m 'docs(decisions): sanea semántica sustituida en ADR vigentes'; if($LASTEXITCODE){throw 'commit'}
          git push origin HEAD:chatgpt-checklist-adr-sweep; if($LASTEXITCODE){throw 'push'}
