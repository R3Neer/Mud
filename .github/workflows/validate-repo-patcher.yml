name: Validate repo-patcher package
run-name: repo-patcher validation ${{ github.ref_name }}

on:
  push:
    branches:
      - 'repo-patcher-validation/**'
    paths:
      - '.repo-patcher-candidates/package.zip'
      - '.repo-patcher-candidates/request.json'

permissions:
  contents: read

concurrency:
  group: repo-patcher-validation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Apply package and run every validator
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout package carrier branch
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare isolated package and target checkout
        id: prepare
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $candidateDirectory = Join-Path `
              $env:GITHUB_WORKSPACE `
              ".repo-patcher-candidates"

          $requestFile = Join-Path `
              $candidateDirectory `
              "request.json"

          $sourcePackage = Join-Path `
              $candidateDirectory `
              "package.zip"

          if (-not (Test-Path -LiteralPath $requestFile -PathType Leaf)) {
              throw "Request metadata was not found: $requestFile"
          }

          if (-not (Test-Path -LiteralPath $sourcePackage -PathType Leaf)) {
              throw "Package was not found: $sourcePackage"
          }

          $request = Get-Content `
              -LiteralPath $requestFile `
              -Raw |
              ConvertFrom-Json

          foreach ($property in "request_id", "target_sha", "package_sha256") {
              if (-not $request.PSObject.Properties[$property]) {
                  throw "request.json is missing required property: $property"
              }

              if ([string]::IsNullOrWhiteSpace([string] $request.$property)) {
                  throw "request.json contains an empty property: $property"
              }
          }

          $carrierSha = (
              git rev-parse HEAD
          ).Trim()

          if ($LASTEXITCODE -ne 0) {
              throw "Could not resolve the carrier commit."
          }

          $parentSha = (
              git rev-parse HEAD^
          ).Trim()

          if ($LASTEXITCODE -ne 0) {
              throw "The carrier commit has no parent commit."
          }

          if ($request.target_sha -ne $parentSha) {
              throw @"
          The requested target is not the direct parent of the carrier commit.

          Carrier: $carrierSha
          Parent:  $parentSha
          Request: $($request.target_sha)
          "@
          }

          $actualHash = (
              Get-FileHash `
                  -LiteralPath $sourcePackage `
                  -Algorithm SHA256
          ).Hash.ToLowerInvariant()

          $expectedHash = (
              [string] $request.package_sha256
          ).ToLowerInvariant()

          if ($actualHash -ne $expectedHash) {
              throw @"
          Package SHA-256 does not match request.json.

          Expected: $expectedHash
          Actual:   $actualHash
          "@
          }

          $packageDirectory = Join-Path `
              $env:RUNNER_TEMP `
              "repo-patcher-input"

          $logDirectory = Join-Path `
              $env:RUNNER_TEMP `
              "repo-patcher-validation"

          $packageFile = Join-Path `
              $packageDirectory `
              "package.zip"

          $diffFile = Join-Path `
              $logDirectory `
              "applied.patch"

          New-Item `
              -ItemType Directory `
              -Path $packageDirectory `
              -Force | Out-Null

          New-Item `
              -ItemType Directory `
              -Path $logDirectory `
              -Force | Out-Null

          Copy-Item `
              -LiteralPath $sourcePackage `
              -Destination $packageFile `
              -Force

          Get-FileHash `
              -LiteralPath $packageFile `
              -Algorithm SHA256 |
              Format-List |
              Out-File `
                  -LiteralPath (
                      Join-Path $logDirectory "package-sha256.txt"
                  ) `
                  -Encoding utf8

          @(
              "request_id=$($request.request_id)"
              "target_sha=$($request.target_sha)"
              "package_file=$packageFile"
              "log_directory=$logDirectory"
              "diff_file=$diffFile"
          ) | Add-Content `
              -LiteralPath $env:GITHUB_OUTPUT `
              -Encoding utf8

          git checkout --detach $request.target_sha
          if ($LASTEXITCODE -ne 0) {
              throw "Could not check out target commit $($request.target_sha)."
          }

          git reset --hard $request.target_sha
          if ($LASTEXITCODE -ne 0) {
              throw "Could not reset to target commit $($request.target_sha)."
          }

          git clean -fdx
          if ($LASTEXITCODE -ne 0) {
              throw "Could not clean the disposable runner checkout."
          }

          $status = @(
              git status --porcelain=v1 --untracked-files=all
          )

          if ($LASTEXITCODE -ne 0) {
              throw "Could not inspect the target working tree."
          }

          if ($status.Count -ne 0) {
              throw @"
          Target checkout is not clean after preparation:

          $($status -join [Environment]::NewLine)
          "@
          }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        shell: pwsh
        run: |
          python -m pip install `
              --disable-pip-version-check `
              "PyYAML==6.0.3"

      - name: Verify vendored repo-patcher
        shell: pwsh
        env:
          PYTHONPATH: ${{ github.workspace }}\tooling\repo-patcher-runtime
        run: |
          $ErrorActionPreference = "Stop"

          $runtime = Join-Path `
              $env:GITHUB_WORKSPACE `
              "tooling\repo-patcher-runtime\repo_patcher"

          if (-not (Test-Path -LiteralPath $runtime -PathType Container)) {
              throw @"
          Vendored repo-patcher runtime was not found at:
            $runtime

          Install the CI kit with a valid -RuntimeSource first.
          "@
          }

          python -m repo_patcher --version
          if ($LASTEXITCODE -ne 0) {
              throw "The vendored repo-patcher runtime could not be executed."
          }

      - name: Validate and apply package
        shell: pwsh
        env:
          PACKAGE_FILE: ${{ steps.prepare.outputs.package_file }}
          LOG_DIR: ${{ steps.prepare.outputs.log_directory }}
          DIFF_FILE: ${{ steps.prepare.outputs.diff_file }}
          REQUEST_ID: ${{ steps.prepare.outputs.request_id }}
          TARGET_SHA: ${{ steps.prepare.outputs.target_sha }}
          PYTHONPATH: ${{ github.workspace }}\tooling\repo-patcher-runtime
        run: |
          $ErrorActionPreference = "Stop"

          $transcript = Join-Path `
              $env:LOG_DIR `
              "validation-transcript.txt"

          Start-Transcript `
              -LiteralPath $transcript `
              -Force

          function Invoke-Checked {
              param(
                  [Parameter(Mandatory)]
                  [string] $Label,

                  [Parameter(Mandatory)]
                  [scriptblock] $Command
              )

              Write-Host "::group::$Label"
              & $Command
              $exitCode = $LASTEXITCODE
              Write-Host "::endgroup::"

              if ($exitCode -ne 0) {
                  throw "$Label failed with exit code $exitCode."
              }
          }

          try {
              git config `
                  --global `
                  --add `
                  safe.directory `
                  $env:GITHUB_WORKSPACE

              Invoke-Checked "Initial Git status" {
                  git status --short --untracked-files=all
              }

              Invoke-Checked "package-info" {
                  python -m repo_patcher `
                      package-info `
                      $env:PACKAGE_FILE
              }

              Invoke-Checked "explain" {
                  python -m repo_patcher `
                      explain `
                      $env:PACKAGE_FILE `
                      --repo $env:GITHUB_WORKSPACE
              }

              Invoke-Checked "check" {
                  python -m repo_patcher `
                      check `
                      $env:PACKAGE_FILE `
                      --repo $env:GITHUB_WORKSPACE
              }

              Invoke-Checked "apply and repository validators" {
                  python -m repo_patcher `
                      apply `
                      $env:PACKAGE_FILE `
                      --repo $env:GITHUB_WORKSPACE `
                      --emit-diff $env:DIFF_FILE
              }

              Invoke-Checked "Explicit git diff --check" {
                  git diff --check
              }

              Invoke-Checked "Post-apply idempotence check" {
                  python -m repo_patcher `
                      check `
                      $env:PACKAGE_FILE `
                      --repo $env:GITHUB_WORKSPACE
              }

              git status --short --untracked-files=all |
                  Tee-Object `
                      -FilePath (
                          Join-Path $env:LOG_DIR "git-status.txt"
                      )

              git diff --stat |
                  Tee-Object `
                      -FilePath (
                          Join-Path $env:LOG_DIR "git-diff-stat.txt"
                      )

              $binaryDiff = Join-Path `
                  $env:LOG_DIR `
                  "git-diff-binary.patch"

              git diff `
                  --binary `
                  --output=$binaryDiff

              if ($LASTEXITCODE -ne 0) {
                  throw "Could not save the final Git diff."
              }

              if (-not (
                  Test-Path `
                      -LiteralPath $env:DIFF_FILE `
                      -PathType Leaf
              )) {
                  throw "repo-patcher did not create the requested diff."
              }

              @"
          ## repo-patcher validation passed

          - Request: $env:REQUEST_ID
          - Target: $env:TARGET_SHA
          - Package branch: $env:GITHUB_REF_NAME
          - Runner: Windows
          - Python: 3.13
          "@ | Add-Content `
              -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          finally {
              Stop-Transcript
          }

      - name: Upload logs and resulting diff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repo-patcher-validation-${{ github.run_id }}
          path: ${{ runner.temp }}\repo-patcher-validation
          if-no-files-found: warn
          retention-days: 14
