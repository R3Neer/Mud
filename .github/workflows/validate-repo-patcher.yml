name: Validate repo-patcher package
run-name: repo-patcher validation ${{ inputs.request_id }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique identifier generated by Submit-RepoPatch.ps1
        required: true
        type: string
      package_ref:
        description: Temporary branch, tag, or SHA containing the package
        required: true
        type: string
      package_path:
        description: Path to the ZIP inside package_ref
        required: true
        type: string
      target_ref:
        description: Commit, tag, or branch against which the package is applied
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: repo-patcher-validation-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  validate:
    name: Apply package and run every validator
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      PACKAGE_FILE: ${{ runner.temp }}\repo-patcher-input\package.zip
      LOG_DIR: ${{ runner.temp }}\repo-patcher-validation
      DIFF_FILE: ${{ runner.temp }}\repo-patcher-validation\applied.patch
      PYTHONPATH: ${{ github.workspace }}\tooling\repo-patcher-runtime

    steps:
      - name: Checkout temporary package branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.package_ref }}
          fetch-depth: 1
          path: _package_carrier
          persist-credentials: false

      - name: Copy package outside the repository
        shell: pwsh
        env:
          PACKAGE_PATH: ${{ inputs.package_path }}
        run: |
          $ErrorActionPreference = "Stop"

          $relative = $env:PACKAGE_PATH.Replace(
              "/",
              [System.IO.Path]::DirectorySeparatorChar
          )
          $source = Join-Path (
              Join-Path $env:GITHUB_WORKSPACE "_package_carrier"
          ) $relative

          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
              throw "Package not found: $source"
          }

          New-Item `
              -ItemType Directory `
              -Path (Split-Path -Parent $env:PACKAGE_FILE) `
              -Force | Out-Null

          New-Item `
              -ItemType Directory `
              -Path $env:LOG_DIR `
              -Force | Out-Null

          Copy-Item `
              -LiteralPath $source `
              -Destination $env:PACKAGE_FILE `
              -Force

          Get-FileHash `
              -LiteralPath $env:PACKAGE_FILE `
              -Algorithm SHA256 |
              Format-List |
              Out-File `
                  -LiteralPath (Join-Path $env:LOG_DIR "package-sha256.txt") `
                  -Encoding utf8

          Remove-Item `
              -LiteralPath (Join-Path $env:GITHUB_WORKSPACE "_package_carrier") `
              -Recurse `
              -Force

      # The target is checked out at the workspace root. Its directory name
      # therefore remains the real repository name, which repo-patcher may
      # validate through repository.names.
      - name: Checkout target repository state
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install runtime dependency
        shell: pwsh
        run: |
          python -m pip install `
              --disable-pip-version-check `
              "PyYAML==6.0.3"

      - name: Verify vendored repo-patcher
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"

          $runtime = Join-Path `
              $env:GITHUB_WORKSPACE `
              "tooling\repo-patcher-runtime\repo_patcher"

          if (-not (Test-Path -LiteralPath $runtime -PathType Container)) {
              throw @"
          Vendored repo-patcher runtime was not found at:
            $runtime

          Install the CI kit with a valid -RuntimeSource first.
          "@
          }

          python -m repo_patcher --version
          if ($LASTEXITCODE -ne 0) {
              throw "The vendored repo-patcher runtime could not be executed."
          }

      - name: Validate and apply package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Path $env:LOG_DIR -Force | Out-Null

          $transcript = Join-Path $env:LOG_DIR "validation-transcript.txt"
          Start-Transcript -LiteralPath $transcript -Force

          function Invoke-Checked {
              param(
                  [Parameter(Mandatory)]
                  [string] $Label,

                  [Parameter(Mandatory)]
                  [scriptblock] $Command
              )

              Write-Host "::group::$Label"
              & $Command
              $exitCode = $LASTEXITCODE
              Write-Host "::endgroup::"

              if ($exitCode -ne 0) {
                  throw "$Label failed with exit code $exitCode."
              }
          }

          try {
              git config --global --add safe.directory $env:GITHUB_WORKSPACE

              Invoke-Checked "Initial Git status" {
                  git status --short --untracked-files=all
              }

              Invoke-Checked "package-info" {
                  python -m repo_patcher `
                      package-info `
                      $env:PACKAGE_FILE
              }

              Invoke-Checked "explain" {
                  python -m repo_patcher `
                      explain `
                      $env:PACKAGE_FILE `
                      --repo $env:GITHUB_WORKSPACE
              }

              Invoke-Checked "check" {
                  python -m repo_patcher `
                      check `
                      $env:PACKAGE_FILE `
                      --repo $env:GITHUB_WORKSPACE
              }

              Invoke-Checked "apply and repository validators" {
                  python -m repo_patcher `
                      apply `
                      $env:PACKAGE_FILE `
                      --repo $env:GITHUB_WORKSPACE `
                      --emit-diff $env:DIFF_FILE
              }

              Invoke-Checked "Explicit git diff --check" {
                  git diff --check
              }

              Invoke-Checked "Post-apply idempotence check" {
                  python -m repo_patcher `
                      check `
                      $env:PACKAGE_FILE `
                      --repo $env:GITHUB_WORKSPACE
              }

              git status --short --untracked-files=all |
                  Tee-Object `
                      -FilePath (Join-Path $env:LOG_DIR "git-status.txt")

              git diff --stat |
                  Tee-Object `
                      -FilePath (Join-Path $env:LOG_DIR "git-diff-stat.txt")

              $binaryDiff = Join-Path $env:LOG_DIR "git-diff-binary.patch"
              git diff --binary --output=$binaryDiff
              if ($LASTEXITCODE -ne 0) {
                  throw "Could not save the final Git diff."
              }

              if (-not (Test-Path -LiteralPath $env:DIFF_FILE -PathType Leaf)) {
                  throw "repo-patcher did not create the requested diff."
              }

              @"
          ## repo-patcher validation passed

          - Request: `${{ inputs.request_id }}`
          - Target: `${{ inputs.target_ref }}`
          - Package carrier: `${{ inputs.package_ref }}`
          - Package path: `${{ inputs.package_path }}`
          - Runner: Windows
          - Python: 3.13
          "@ | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY
          }
          finally {
              Stop-Transcript
          }

      - name: Upload logs and resulting diff
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repo-patcher-validation-${{ inputs.request_id }}
          path: ${{ runner.temp }}\repo-patcher-validation
          if-no-files-found: warn
          retention-days: 14
