name: Validate repo-patcher package
run-name: ${{ github.event_name == 'workflow_dispatch' && format('repo-patcher validation {0}', inputs.request_id) || github.event_name == 'pull_request' && 'repo-patcher CI self-test' || 'repo-patcher scheduled queue scan' }}

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Unique validation request identifier
        required: true
        type: string
      package_ref:
        description: Temporary branch containing the package ZIP
        required: true
        type: string
      package_path:
        description: Repository-relative path to the package ZIP
        required: true
        type: string
      target_sha:
        description: Exact repository commit to validate against
        required: true
        type: string
      package_sha256:
        description: Expected SHA-256 of the package ZIP
        required: true
        type: string
      trust_plugin:
        description: Explicitly authorize a Python plugin contained in the package
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "*/5 * * * *"
  pull_request:
    paths:
      - ".github/workflows/validate-repo-patcher.yml"
      - "tooling/repo-patcher-ci/**"

permissions: {}

concurrency:
  group: ${{ github.event_name == 'schedule' && 'repo-patcher-issue-queue' || github.event_name == 'workflow_dispatch' && format('repo-patcher-manual-{0}', inputs.request_id) || format('repo-patcher-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  self_test:
    name: Test queue and workflow contract
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install Python dependency
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Compile and run unit tests
        shell: bash
        run: |
          set -euo pipefail
          tooling=tooling/repo-patcher-ci
          python -m py_compile \
            "$tooling/issue_transport.py" \
            "$tooling/issue_queue.py" \
            "$tooling/package_checks.py" \
            "$tooling/test_issue_transport.py" \
            "$tooling/test_issue_queue.py" \
            "$tooling/test_package_checks.py" \
            "$tooling/test_workflow_contract.py"
          python "$tooling/test_issue_transport.py"
          python "$tooling/test_issue_queue.py"
          PYTHONPATH=tooling/repo-patcher-runtime python "$tooling/test_package_checks.py"
          pwsh -File "$tooling/Test-PluginConsent.ps1"
          MUD_WORKFLOW_PATH=.github/workflows/validate-repo-patcher.yml python "$tooling/test_workflow_contract.py"
      - name: Run pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/validate-repo-patcher.yml

  prepare:
    if: github.event_name != 'pull_request'
    name: Claim and prepare one request
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    outputs:
      found: ${{ steps.metadata.outputs.found }}
      prepared: ${{ steps.metadata.outputs.prepared }}
      source: ${{ steps.metadata.outputs.source }}
      issue_number: ${{ steps.metadata.outputs.issue_number }}
      request_id: ${{ steps.metadata.outputs.request_id }}
      target_sha: ${{ steps.metadata.outputs.target_sha }}
      package_sha256: ${{ steps.metadata.outputs.package_sha256 }}
      trust_plugin: ${{ steps.metadata.outputs.trust_plugin }}
      handoff_artifact: ${{ steps.metadata.outputs.handoff_artifact }}

    steps:
      - name: Prepare handoff paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/repo-patcher-handoff"
          mkdir -p "$handoff"
          {
            echo "handoff=$handoff"
            echo "package=$handoff/package.zip"
            echo "request=$handoff/request.json"
            echo "transport_report=$handoff/transport-report.json"
            echo "queue_report=$handoff/queue-report.json"
            echo "failure=$handoff/failure-summary.txt"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Checkout queue control plane
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: _control
          persist-credentials: false

      - name: Claim oldest complete issue request
        if: github.event_name == 'schedule'
        id: queue
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PACKAGE_FILE: ${{ steps.paths.outputs.package }}
          REQUEST_FILE: ${{ steps.paths.outputs.request }}
          TRANSPORT_REPORT: ${{ steps.paths.outputs.transport_report }}
          QUEUE_REPORT: ${{ steps.paths.outputs.queue_report }}
        run: |
          set -euo pipefail
          python _control/tooling/repo-patcher-ci/issue_queue.py claim \
            --repository "$REPOSITORY" \
            --allowed-actor R3Neer \
            --allowed-actor efferra \
            --run-id "$RUN_ID" \
            --output-package "$PACKAGE_FILE" \
            --output-request "$REQUEST_FILE" \
            --output-transport-report "$TRANSPORT_REPORT" \
            --output-queue-report "$QUEUE_REPORT"

      - name: Checkout manual package carrier
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.package_ref }}
          fetch-depth: 1
          path: _carrier
          persist-credentials: false

      - name: Prepare manually dispatched package
        if: github.event_name == 'workflow_dispatch'
        id: manual
        shell: pwsh
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          PACKAGE_PATH: ${{ inputs.package_path }}
          EXPECTED_SHA256: ${{ inputs.package_sha256 }}
          TARGET_SHA: ${{ inputs.target_sha }}
          TRUST_PLUGIN: ${{ inputs.trust_plugin }}
          PACKAGE_FILE: ${{ steps.paths.outputs.package }}
          REQUEST_FILE: ${{ steps.paths.outputs.request }}
          TRANSPORT_REPORT: ${{ steps.paths.outputs.transport_report }}
          QUEUE_REPORT: ${{ steps.paths.outputs.queue_report }}
          FAILURE_FILE: ${{ steps.paths.outputs.failure }}
        run: |
          $ErrorActionPreference = "Stop"
          $prepared = $false
          try {
              $relative = $env:PACKAGE_PATH.Replace("/", [System.IO.Path]::DirectorySeparatorChar)
              $source = Join-Path (Join-Path $env:GITHUB_WORKSPACE "_carrier") $relative
              if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
                  throw "Package not found in carrier branch: $source"
              }
              Copy-Item -LiteralPath $source -Destination $env:PACKAGE_FILE -Force
              $actualHash = (Get-FileHash -LiteralPath $env:PACKAGE_FILE -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -ne $env:EXPECTED_SHA256.ToLowerInvariant()) {
                  throw "Package SHA-256 mismatch."
              }
              $trust = [System.Convert]::ToBoolean($env:TRUST_PLUGIN)
              $request = [ordered]@{
                  protocol = "mud-repo-patcher-dispatch/v1"
                  request_id = $env:REQUEST_ID
                  repository = $env:GITHUB_REPOSITORY
                  target_sha = $env:TARGET_SHA.ToLowerInvariant()
                  package_sha256 = $actualHash
                  package_size = (Get-Item -LiteralPath $env:PACKAGE_FILE).Length
                  trust_plugin = $trust
              }
              $request | ConvertTo-Json | Set-Content -LiteralPath $env:REQUEST_FILE -Encoding utf8
              $request | ConvertTo-Json | Set-Content -LiteralPath $env:TRANSPORT_REPORT -Encoding utf8
              $prepared = $true
          }
          catch {
              $_ | Out-String | Set-Content -LiteralPath $env:FAILURE_FILE -Encoding utf8
          }
          [ordered]@{
              found = $true
              prepared = $prepared
              source = "workflow_dispatch"
              issue_number = ""
              request_id = $env:REQUEST_ID
              target_sha = $env:TARGET_SHA.ToLowerInvariant()
              package_sha256 = $env:EXPECTED_SHA256.ToLowerInvariant()
              trust_plugin = [System.Convert]::ToBoolean($env:TRUST_PLUGIN)
          } | ConvertTo-Json | Set-Content -LiteralPath $env:QUEUE_REPORT -Encoding utf8
          @(
              "found=true"
              "prepared=$($prepared.ToString().ToLowerInvariant())"
              "source=workflow_dispatch"
              "issue_number="
              "request_id=$env:REQUEST_ID"
              "target_sha=$($env:TARGET_SHA.ToLowerInvariant())"
              "package_sha256=$($env:EXPECTED_SHA256.ToLowerInvariant())"
              "trust_plugin=$([System.Convert]::ToBoolean($env:TRUST_PLUGIN).ToString().ToLowerInvariant())"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Resolve prepared metadata
        id: metadata
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          QUEUE_FOUND: ${{ steps.queue.outputs.found }}
          QUEUE_PREPARED: ${{ steps.queue.outputs.prepared }}
          QUEUE_SOURCE: ${{ steps.queue.outputs.source }}
          QUEUE_ISSUE: ${{ steps.queue.outputs.issue_number }}
          QUEUE_REQUEST: ${{ steps.queue.outputs.request_id }}
          QUEUE_TARGET: ${{ steps.queue.outputs.target_sha }}
          QUEUE_HASH: ${{ steps.queue.outputs.package_sha256 }}
          QUEUE_TRUST: ${{ steps.queue.outputs.trust_plugin }}
          MANUAL_FOUND: ${{ steps.manual.outputs.found }}
          MANUAL_PREPARED: ${{ steps.manual.outputs.prepared }}
          MANUAL_SOURCE: ${{ steps.manual.outputs.source }}
          MANUAL_ISSUE: ${{ steps.manual.outputs.issue_number }}
          MANUAL_REQUEST: ${{ steps.manual.outputs.request_id }}
          MANUAL_TARGET: ${{ steps.manual.outputs.target_sha }}
          MANUAL_HASH: ${{ steps.manual.outputs.package_sha256 }}
          MANUAL_TRUST: ${{ steps.manual.outputs.trust_plugin }}
          HANDOFF_ARTIFACT: repo-patcher-handoff-${{ github.run_id }}
        run: |
          $prefix = if ($env:EVENT_NAME -eq "schedule") { "QUEUE" } else { "MANUAL" }
          $values = [ordered]@{
              found = [Environment]::GetEnvironmentVariable("${prefix}_FOUND")
              prepared = [Environment]::GetEnvironmentVariable("${prefix}_PREPARED")
              source = [Environment]::GetEnvironmentVariable("${prefix}_SOURCE")
              issue_number = [Environment]::GetEnvironmentVariable("${prefix}_ISSUE")
              request_id = [Environment]::GetEnvironmentVariable("${prefix}_REQUEST")
              target_sha = [Environment]::GetEnvironmentVariable("${prefix}_TARGET")
              package_sha256 = [Environment]::GetEnvironmentVariable("${prefix}_HASH")
              trust_plugin = [Environment]::GetEnvironmentVariable("${prefix}_TRUST")
              handoff_artifact = $env:HANDOFF_ARTIFACT
          }
          foreach ($entry in $values.GetEnumerator()) {
              "$($entry.Key)=$($entry.Value)" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          }

      - name: Upload prepared handoff
        if: steps.metadata.outputs.found == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.metadata.outputs.handoff_artifact }}
          path: ${{ steps.paths.outputs.handoff }}
          if-no-files-found: warn
          retention-days: 14

  validate:
    name: Apply package and run every validator
    needs: prepare
    if: needs.prepare.outputs.found == 'true' && needs.prepare.outputs.prepared == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      conclusion: ${{ steps.validation.outputs.conclusion }}
      artifact_name: ${{ steps.validation.outputs.artifact_name }}

    steps:
      - name: Prepare validation paths
        id: paths
        shell: pwsh
        run: |
          $handoff = Join-Path $env:RUNNER_TEMP "repo-patcher-handoff"
          $logs = Join-Path $env:RUNNER_TEMP "repo-patcher-validation"
          New-Item -ItemType Directory -Path $handoff -Force | Out-Null
          New-Item -ItemType Directory -Path $logs -Force | Out-Null
          @(
              "handoff=$handoff"
              "logs=$logs"
              "package=$(Join-Path $handoff 'package.zip')"
              "request=$(Join-Path $handoff 'request.json')"
              "diff=$(Join-Path $logs 'applied.patch')"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Download prepared handoff
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.prepare.outputs.handoff_artifact }}
          path: ${{ steps.paths.outputs.handoff }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Checkout validation control plane
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: _control
          persist-credentials: false

      - name: Checkout exact target commit
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.target_sha }}
          fetch-depth: 0
          path: _target
          persist-credentials: false

      - name: Install runtime dependency
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"

      - name: Validate package
        id: validation
        shell: pwsh
        env:
          PACKAGE_FILE: ${{ steps.paths.outputs.package }}
          REQUEST_FILE: ${{ steps.paths.outputs.request }}
          LOG_DIR: ${{ steps.paths.outputs.logs }}
          DIFF_FILE: ${{ steps.paths.outputs.diff }}
          TARGET_REPO: ${{ github.workspace }}\_target
          CONTROL_ROOT: ${{ github.workspace }}\_control
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
          TARGET_SHA: ${{ needs.prepare.outputs.target_sha }}
          PACKAGE_SHA256: ${{ needs.prepare.outputs.package_sha256 }}
          TRUST_PLUGIN: ${{ needs.prepare.outputs.trust_plugin }}
          ARTIFACT_NAME: repo-patcher-validation-${{ needs.prepare.outputs.request_id }}
          PYTHONPATH: ${{ github.workspace }}\_target\tooling\repo-patcher-runtime
        run: |
          $ErrorActionPreference = "Stop"
          $transcript = Join-Path $env:LOG_DIR "validation-transcript.txt"
          $failure = Join-Path $env:LOG_DIR "failure-summary.txt"
          $conclusion = "failure"
          Start-Transcript -LiteralPath $transcript -Force

          function Invoke-Checked {
              param([string] $Label, [scriptblock] $Command)
              Write-Host "::group::$Label"
              $global:LASTEXITCODE = 0
              & $Command
              $exitCode = $LASTEXITCODE
              Write-Host "::endgroup::"
              if ($exitCode -ne 0) { throw "$Label failed with exit code $exitCode." }
          }

          try {
              $actualHead = (& git -C $env:TARGET_REPO rev-parse HEAD).Trim()
              if ($actualHead -ne $env:TARGET_SHA) { throw "Wrong target commit." }
              $actualHash = (Get-FileHash -LiteralPath $env:PACKAGE_FILE -Algorithm SHA256).Hash.ToLowerInvariant()
              if ($actualHash -ne $env:PACKAGE_SHA256) { throw "Package identity changed after transport." }
              Copy-Item -LiteralPath $env:REQUEST_FILE -Destination (Join-Path $env:LOG_DIR "request.json") -Force

              $checks = Join-Path $env:CONTROL_ROOT "tooling\repo-patcher-ci\package_checks.py"
              $pluginPresent = (& python $checks plugin --package $env:PACKAGE_FILE).Trim().ToLowerInvariant()
              if ($pluginPresent -notin @("true", "false")) { throw "Could not inspect package plugin policy." }
              if ($pluginPresent -eq "true" -and $env:TRUST_PLUGIN -ne "true") {
                  throw "The package contains a Python plugin, but this request did not authorize it."
              }
              $trustArguments = @()
              if ($pluginPresent -eq "true") { $trustArguments = @("--trust-plugin") }

              [ordered]@{
                  request_id = $env:REQUEST_ID
                  target_sha = $env:TARGET_SHA
                  package_sha256 = $env:PACKAGE_SHA256
                  plugin_present = ($pluginPresent -eq "true")
                  plugin_authorized = ($pluginPresent -eq "true" -and $env:TRUST_PLUGIN -eq "true")
                  runner = "windows-latest"
                  python = "3.13"
              } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $env:LOG_DIR "validation-metadata.json") -Encoding utf8

              Invoke-Checked "vendored runtime" { python -m repo_patcher --version }
              Invoke-Checked "initial Git status" { git -C $env:TARGET_REPO status --short --untracked-files=all }
              Invoke-Checked "package-info" { python -m repo_patcher package-info $env:PACKAGE_FILE }
              Invoke-Checked "explain" { python -m repo_patcher explain $env:PACKAGE_FILE --repo $env:TARGET_REPO @trustArguments }
              Invoke-Checked "check before apply" { python -m repo_patcher check $env:PACKAGE_FILE --repo $env:TARGET_REPO @trustArguments }
              Invoke-Checked "apply and declared validators" { python -m repo_patcher apply $env:PACKAGE_FILE --repo $env:TARGET_REPO --emit-diff $env:DIFF_FILE @trustArguments }
              Invoke-Checked "explicit git diff --check" { git -C $env:TARGET_REPO diff --check }
              Invoke-Checked "check after apply" { python -m repo_patcher check $env:PACKAGE_FILE --repo $env:TARGET_REPO @trustArguments }
              Invoke-Checked "prove second plan is a no-op" { python $checks idempotence --repo $env:TARGET_REPO --package $env:PACKAGE_FILE }
              $conclusion = "success"
          }
          catch {
              $_ | Out-String | Set-Content -LiteralPath $failure -Encoding utf8
          }
          finally {
              git -C $env:TARGET_REPO status --short --untracked-files=all 2>&1 | Set-Content -LiteralPath (Join-Path $env:LOG_DIR "git-status.txt") -Encoding utf8
              git -C $env:TARGET_REPO diff --stat 2>&1 | Set-Content -LiteralPath (Join-Path $env:LOG_DIR "git-diff-stat.txt") -Encoding utf8
              $binaryDiff = Join-Path $env:LOG_DIR "git-diff-binary.patch"
              git -C $env:TARGET_REPO diff --binary --no-ext-diff --output=$binaryDiff 2>&1 | Out-Null
              Stop-Transcript
          }
          @(
              "conclusion=$conclusion"
              "artifact_name=$env:ARTIFACT_NAME"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.validation.outputs.artifact_name || format('repo-patcher-validation-{0}', needs.prepare.outputs.request_id) }}
          path: ${{ steps.paths.outputs.logs }}
          if-no-files-found: warn
          retention-days: 14

  finalize:
    name: Publish result and close request
    needs: [prepare, validate]
    if: always() && needs.prepare.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write

    steps:
      - name: Set up Python
        if: needs.prepare.outputs.source == 'issue_queue'
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Checkout queue control plane
        if: needs.prepare.outputs.source == 'issue_queue'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          path: _control
          persist-credentials: false

      - name: Resolve final conclusion
        id: result
        shell: bash
        env:
          PREPARED: ${{ needs.prepare.outputs.prepared }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
          VALIDATION_CONCLUSION: ${{ needs.validate.outputs.conclusion }}
          VALIDATION_ARTIFACT: ${{ needs.validate.outputs.artifact_name }}
          HANDOFF_ARTIFACT: ${{ needs.prepare.outputs.handoff_artifact }}
        run: |
          set -euo pipefail
          conclusion=failure
          artifact="$HANDOFF_ARTIFACT"
          if [[ "$PREPARED" == "true" && "$VALIDATION_RESULT" == "success" && "$VALIDATION_CONCLUSION" == "success" ]]; then
            conclusion=success
            artifact="$VALIDATION_ARTIFACT"
          elif [[ -n "$VALIDATION_ARTIFACT" ]]; then
            artifact="$VALIDATION_ARTIFACT"
          fi
          {
            echo "conclusion=$conclusion"
            echo "artifact_name=$artifact"
          } >> "$GITHUB_OUTPUT"

      - name: Publish issue result
        if: needs.prepare.outputs.source == 'issue_queue'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          REQUEST_ID: ${{ needs.prepare.outputs.request_id }}
          PACKAGE_SHA256: ${{ needs.prepare.outputs.package_sha256 }}
          CONCLUSION: ${{ steps.result.outputs.conclusion }}
          ARTIFACT_NAME: ${{ steps.result.outputs.artifact_name }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python _control/tooling/repo-patcher-ci/issue_queue.py finalize \
            --repository "$REPOSITORY" \
            --issue-number "$ISSUE_NUMBER" \
            --request-id "$REQUEST_ID" \
            --run-id "$RUN_ID" \
            --conclusion "$CONCLUSION" \
            --package-sha256 "$PACKAGE_SHA256" \
            --artifact-name "$ARTIFACT_NAME" \
            --run-url "$RUN_URL"

      - name: Reflect validation failure in workflow conclusion
        if: steps.result.outputs.conclusion != 'success'
        shell: bash
        run: |
          echo "RepoPatcher validation failed; evidence was preserved and the issue was finalized." >&2
          exit 1
