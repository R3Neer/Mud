name: ChatGPT fix D087 CST residue

on:
  push:
    branches:
      - chatgpt-fix-d087-cst-runner

permissions:
  contents: write

jobs:
  fix-and-validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: chatgpt-fix-d087-cst-candidate
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
          if ($LASTEXITCODE -ne 0) { throw 'PyYAML installation failed' }

      - name: Verify base and apply exact D087 cleanup
        shell: pwsh
        env:
          BASE: 0f0897a734a327280ded1cfa5b098135f2fe571a
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:BASE) { throw 'candidate base mismatch' }
          if (git status --porcelain=v1 --untracked-files=all) { throw 'candidate checkout not clean' }
          @'
          from pathlib import Path
          p = Path('especificacion/sintaxis/cst-sin-perdidas.md')
          t = p.read_text(encoding='utf-8')
          changes = [
              ('  - D-086\n', '  - D-086\n  - D-087\n', 'frontmatter D087'),
              ('intrinsic-name-override  → IntrinsicNameOverrideSyntax', 'metadata-assignment       → MetadataAssignmentSyntax', 'stale CST example'),
              ('- Propiedades de unidad duplicadas.', '- Declaraciones de metadatos duplicadas en un mismo propietario, incluidas las unidades.', 'unit metadata terminology'),
          ]
          for old, new, label in changes:
              if t.count(old) != 1:
                  raise SystemExit(f'{label}: expected once, found {t.count(old)}')
              t = t.replace(old, new, 1)
          p.write_text(t, encoding='utf-8', newline='\n')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'exact cleanup failed' }

      - name: Stage 1 targeted invariants
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          t = Path('especificacion/sintaxis/cst-sin-perdidas.md').read_text(encoding='utf-8')
          for need in (
              '  - D-087',
              'metadata-assignment       → MetadataAssignmentSyntax',
              'Declaraciones de metadatos duplicadas en un mismo propietario, incluidas las unidades.',
              'No existe `ANCHOR_INTERPOLATION_START`',
          ):
              if need not in t: raise SystemExit(f'missing {need!r}')
          for stale in (
              'intrinsic-name-override  → IntrinsicNameOverrideSyntax',
              '- Propiedades de unidad duplicadas.',
              '- `ANCHOR_INTERPOLATION_START`.',
          ):
              if stale in t: raise SystemExit(f'stale {stale!r}')
          print('D087_CST_TARGETED_OK')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'targeted invariant failure' }

      - name: Stage 2 official validators
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { throw 'decision validation failed' }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { throw 'question validation failed' }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { throw 'grammar validation failed' }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { throw 'syntax model validation failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff check failed' }

      - name: Stage 3 exact surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = @(git status --porcelain=v1 --untracked-files=all | ForEach-Object { $_.Substring(3).Trim('"') })
          if ($actual.Count -ne 1 -or $actual[0] -ne 'especificacion/sintaxis/cst-sin-perdidas.md') {
            Write-Host 'ACTUAL:'; $actual
            throw 'unexpected cleanup surface'
          }
          git diff -- especificacion/sintaxis/cst-sin-perdidas.md

      - name: Commit cleanup candidate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add especificacion/sintaxis/cst-sin-perdidas.md
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged diff check failed' }
          git commit -m "fix(spec): limpia residuos CST de D-087"
          if ($LASTEXITCODE -ne 0) { throw 'cleanup commit failed' }
          git push origin HEAD:chatgpt-fix-d087-cst-candidate
          if ($LASTEXITCODE -ne 0) { throw 'cleanup push failed' }
