name: ChatGPT global coherence resume phase 4c v2
on:
  push:
    branches: [chatgpt-global-coherence-resume-runner-f]
permissions: {contents: write}
jobs:
  empty-extrema:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-resume-runner-f, path: runner, fetch-depth: 0}
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-resume-20260816-e, path: target, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Base exacta
        shell: pwsh
        working-directory: target
        env: {BASE: 7e79fc78283fbce2f568cf90d0afd6517e758fd7}
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:BASE){throw 'base mismatch'}
          if(git status --porcelain=v1 --untracked-files=all){throw 'dirty base'}
      - name: Transformación
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force tooling/chatgpt | Out-Null
          Copy-Item ../runner/tooling/chatgpt/resume_phase4c_empty_extrema.py tooling/chatgpt/x.py
          Copy-Item ../runner/tooling/chatgpt/resume_phase4c_relation_fix.py tooling/chatgpt/r.py
          Copy-Item ../runner/tooling/chatgpt/resume_phase4c_review_fixes.py tooling/chatgpt/h.py
          python tooling/chatgpt/x.py; if($LASTEXITCODE){throw 'transform'}
          python tooling/chatgpt/r.py; if($LASTEXITCODE){throw 'relation fix'}
          python tooling/chatgpt/h.py; if($LASTEXITCODE){throw 'review fixes'}
          Remove-Item tooling/chatgpt/x.py,tooling/chatgpt/r.py,tooling/chatgpt/h.py
          python tooling/decisions/manage_decisions.py generate; if($LASTEXITCODE){throw 'decisions generate'}
      - name: Invariantes
        shell: pwsh
        working-directory: target
        run: |
          @'
          from pathlib import Path
          def r(p): return Path(p).read_text(encoding='utf-8')
          d47=r('notas/decisiones/ADR-047-cuantificadores-e-iteracion-finita.md')
          assert 'producen el error definido para agregación vacía' not in d47
          assert 'usa `[0]` si la vacuidad se demuestra, `[0..1]` si sigue siendo posible y `[1]`' in d47
          d93=r('notas/decisiones/ADR-093-extremos-vacios-como-ausencia-tipada.md')
          assert '- Modifica: [[ADR-047-cuantificadores-e-iteracion-finita|D-047]].\n\n## Contexto' in d93
          assert 'Si el análisis demuestra cero iteraciones, su cardinalidad exterior es `[0]`.' in d93
          assert 'Si la fuente puede estar vacía o no vacía, la forma conservadora es `[0..1]`.' in d93
          assert 'Si se demuestra al menos un candidato, se estrecha a `[1]`.' in d93
          assert 'Alinea con:' not in d93
          s=r('especificacion/07-gramatica-concreta.md')
          assert '`[0]` si el análisis demuestra vacuidad, `[0..1]` si la vacuidad sigue siendo posible y `[1]`' in s
          c=r('especificacion/sintaxis/casos/cst-ast.yaml')
          assert c.count('result-cardinality-[0]\n  - statically-known-empty') == 2
          assert c.count('result-cardinality-[0..1]\n  - statically-known-empty') == 0
          assert 'id: extrema-proven-nonempty' in c and 'result-cardinality-[1]' in c
          idx=r('notas/decisiones/README.md')
          assert '| D-093 | vigente | 2026-08-16 |' in idx
          print('PHASE4C_V2_INVARIANTS_OK')
          '@ | python -
          if($LASTEXITCODE){throw 'invariants'}
      - name: Validadores
        shell: pwsh
        working-directory: target
        run: |
          python tooling/decisions/manage_decisions.py validate; if($LASTEXITCODE){throw 'decisions'}
          python tooling/questions/validate_questions.py; if($LASTEXITCODE){throw 'questions'}
          python especificacion/gramatica/validate_grammar.py; if($LASTEXITCODE){throw 'grammar'}
          python especificacion/sintaxis/validate_syntax_model.py; if($LASTEXITCODE){throw 'syntax'}
          git diff --check; if($LASTEXITCODE){throw 'diff'}
      - name: Superficie
        shell: pwsh
        working-directory: target
        run: |
          $allowed=@('especificacion/07-gramatica-concreta.md','especificacion/sintaxis/casos/cst-ast.yaml','notas/decisiones/ADR-047-cuantificadores-e-iteracion-finita.md','notas/decisiones/ADR-093-extremos-vacios-como-ausencia-tipada.md','notas/decisiones/README.md')
          $actual=@(git status --porcelain=v1 --untracked-files=all|%{$p=$_.Substring(3);if($p -match ' -> '){$p=($p -split ' -> ',2)[1]};$p.Trim('"')})|Sort-Object -Unique
          foreach($p in $actual){if($allowed -notcontains $p){throw "unexpected $p"}}
          if($actual.Count -ne $allowed.Count){throw "changed-path count mismatch: $($actual.Count)"}
          foreach($p in $allowed){if($actual -notcontains $p){throw "missing expected change $p"}}
          git diff --stat
      - name: Commit candidato
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add --all
          git diff --cached --check; if($LASTEXITCODE){throw 'staged diff'}
          git commit -m "spec(language): devuelve empty en extremos vacíos" -m "D-093 sustituye el error especial de min/max sin iteraciones por ausencia tipada. La cardinalidad se estrecha a [0], [0..1] o [1] según vacuidad, posibilidad o no-vacuidad demostradas.`n`nValidation: invariantes específicas, decisiones, preguntas, gramática, sintaxis y git diff --check."; if($LASTEXITCODE){throw 'commit'}
          git push origin HEAD:chatgpt-global-coherence-resume-20260816-e; if($LASTEXITCODE){throw 'push'}
