name: ChatGPT fix stale anchor interpolation token

on:
  push:
    branches:
      - chatgpt-fix-anchor-token-runner

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: chatgpt-fix-anchor-token-candidate
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
          if ($LASTEXITCODE -ne 0) { throw 'PyYAML installation failed' }

      - name: Verify base and remove stale token listing
        shell: pwsh
        env:
          BASE: ba2b61b5d1595b769fe1a7e5c3ea80cdce8d7f8c
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:BASE) { throw 'base mismatch' }
          @'
          from pathlib import Path
          p = Path('especificacion/sintaxis/cst-sin-perdidas.md')
          text = p.read_text(encoding='utf-8')
          old = '- `INTERPOLATION_START`.\n- `ANCHOR_INTERPOLATION_START`.\n- `INTERPOLATION_END`.\n'
          new = '- `INTERPOLATION_START`.\n- `INTERPOLATION_END`.\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale token listing, found {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text.rstrip('\n') + '\n', encoding='utf-8', newline='\n')
          result = p.read_text(encoding='utf-8')
          if old in result:
              raise SystemExit('stale positive token listing remains')
          if 'No existe `ANCHOR_INTERPOLATION_START`' not in result:
              raise SystemExit('negative retirement statement missing')
          print('ANCHOR_TOKEN_PROSE_FIXED')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'fix failed' }

      - name: Validate repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { throw 'decision validation failed' }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { throw 'question validation failed' }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { throw 'grammar validation failed' }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { throw 'syntax validation failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
          $paths = @(git diff --name-only)
          if ($paths.Count -ne 1 -or $paths[0] -ne 'especificacion/sintaxis/cst-sin-perdidas.md') { throw "unexpected surface: $($paths -join ', ')" }

      - name: Commit fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add especificacion/sintaxis/cst-sin-perdidas.md
          git commit -m "fix(syntax): retira token de interpolación de ancla residual"
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:chatgpt-fix-anchor-token-candidate
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
