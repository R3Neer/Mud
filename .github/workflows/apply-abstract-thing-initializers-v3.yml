name: Apply abstract thing initializer semantics v3

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidate branch
        uses: actions/checkout@v4
        with:
          ref: patch/abstract-thing-initializers-v2
          fetch-depth: 0

      - name: Verify candidate ancestry
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD 83234608e47c0fe8a68da12573ee57c61f5958ca)" = "83234608e47c0fe8a68da12573ee57c61f5958ca"
          test -z "$(git status --porcelain)"

      - name: Apply transformation
        run: python .control/apply_abstract_thing_initializers_v2.py

      - name: Install validator dependencies
        run: python -m pip install -r especificacion/sintaxis/requirements.txt

      - name: Run official validators
        shell: bash
        run: |
          set -euo pipefail
          python tooling/decisions/manage_decisions.py validate
          python tooling/questions/validate_questions.py
          python especificacion/gramatica/validate_grammar.py
          python especificacion/sintaxis/validate_syntax_model.py
          git diff --check

      - name: Commit candidate changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add -- \
            notas/decisiones/ADR-015-especializacion-aciclica-y-estado-independiente.md \
            especificacion/07-gramatica-concreta.md \
            especificacion/08-sintaxis-abstracta.md \
            especificacion/sintaxis/cst-a-ast-superficial.md \
            especificacion/sintaxis/casos/cst-ast.yaml \
            especificacion/sintaxis/validate_syntax_model.py
          git diff --cached --check
          git commit -m "spec(language): define inicializadores heredados de thing" -m "Context:\n- Las abstract thing deben poder inicializar campos heredados sin adquirir estado concreto propio.\n- Una misma thing no puede declarar un campo y además inicializarlo mediante otra instrucción.\n\nChanges:\n- Hace heredables las contribuciones de inicialización de abstract thing y conserva locales las de concretas.\n- Prohíbe declaración e inicializador separado del mismo campo en una definición.\n- Alinea D-015, capítulos 07/08, transformación y casos sintácticos.\n\nValidation:\n- manage_decisions.py validate\n- validate_questions.py\n- validate_grammar.py\n- validate_syntax_model.py\n- git diff --check"
          git push origin HEAD:patch/abstract-thing-initializers-v2
