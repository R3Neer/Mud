name: ChatGPT D088 candidate v7b

on:
  push:
    branches:
      - chatgpt-d088-runner-v7b

permissions:
  contents: write

jobs:
  rebuild-review-and-commit:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: Checkout v7b control
        uses: actions/checkout@v6
        with:
          ref: chatgpt-d088-runner-v7b
          path: runner
          fetch-depth: 0

      - name: Checkout deterministic transforms through v4
        uses: actions/checkout@v6
        with:
          ref: chatgpt-d088-runner-v4
          path: prior
          fetch-depth: 0

      - name: Checkout v5 and v6 review transforms
        uses: actions/checkout@v6
        with:
          ref: chatgpt-d088-runner-v6
          path: review6
          fetch-depth: 0

      - name: Checkout clean candidate base
        uses: actions/checkout@v6
        with:
          ref: chatgpt-d088-candidate-v7b
          path: target
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
          if ($LASTEXITCODE -ne 0) { throw 'PyYAML installation failed' }

      - name: Verify exact base
        shell: pwsh
        working-directory: target
        env:
          BASE: 1e2c793b6ae0ae4a7abbab416f5e16c9f2a40e67
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:BASE) { throw 'candidate base mismatch' }
          if (git status --porcelain=v1 --untracked-files=all) { throw 'candidate checkout not clean' }

      - name: Rebuild D088 and apply review stack
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          python ../prior/tooling/chatgpt/transform_d088.py .
          if ($LASTEXITCODE -ne 0) { throw 'D088 transform failed' }
          python ../prior/tooling/chatgpt/transform_d088_fix_v2.py .
          if ($LASTEXITCODE -ne 0) { throw 'D088 v2 correction failed' }
          python ../prior/tooling/chatgpt/transform_d088_fix_v3.py .
          if ($LASTEXITCODE -ne 0) { throw 'D088 v3 correction failed' }
          python ../prior/tooling/chatgpt/transform_d088_fix_examples.py .
          if ($LASTEXITCODE -ne 0) { throw 'D088 example sweep failed' }
          python ../prior/tooling/chatgpt/transform_d088_fix_cst.py .
          if ($LASTEXITCODE -ne 0) { throw 'D088 CST correction failed' }
          python ../review6/tooling/chatgpt/transform_d088_fix_v5.py .
          if ($LASTEXITCODE -ne 0) { throw 'D088 v5 correction failed' }
          python ../review6/tooling/chatgpt/transform_d088_fix_v6.py .
          if ($LASTEXITCODE -ne 0) { throw 'D088 v6 correction failed' }
          python ../runner/tooling/chatgpt/transform_d088_fix_v7.py .
          if ($LASTEXITCODE -ne 0) { throw 'D088 v7 correction failed' }
          python tooling/decisions/manage_decisions.py generate
          if ($LASTEXITCODE -ne 0) { throw 'decision generation failed' }
          python tooling/questions/validate_questions.py generate
          if ($LASTEXITCODE -ne 0) { throw 'question generation failed' }

      - name: Stage 1 semantic and regression invariants
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import yaml

          def r(p): return Path(p).read_text(encoding='utf-8')
          def need(p,s):
              if s not in r(p): raise SystemExit(f'MISSING {s!r} in {p}')
          def forbid(p,s):
              if s in r(p): raise SystemExit(f'STALE {s!r} in {p}')

          grammar='especificacion/gramatica/mud.ebnf'
          need(grammar,'expression-block')
          need(grammar,'expression-body')
          forbid(grammar,'boolean-block')
          forbid(grammar,'expression-clause-body')
          need(grammar,', ":"\n        , [ required-separation ]\n        , ( effect | effect-block )')
          if r(grammar).count(', ":" , [ required-separation ] , expression-body') != 2:
              raise SystemExit('selection/quantifier separator regression')

          asdl='especificacion/sintaxis/mud-surface-ast.asdl'
          need(asdl,'expression_block = ExpressionBlock')
          forbid(asdl,'BooleanBlock')
          need(asdl,'ForEachEffect(iteration_binding binding,')
          need(asdl,'SelectionExpr(iteration_binding binding,')
          need(asdl,'QuantifierExpr(quantifier_kind kind,')

          kinds=yaml.safe_load(r('especificacion/sintaxis/mud-syntax-kinds.yaml'))['syntax_nodes']
          for key in ('for-each-effect','selection-expression','quantifier-expression'):
              item=kinds[key]
              if 'required-separation' not in item['rhs'] or 'required-separation' not in item['references']:
                  raise SystemExit(f'{key}: separator not synchronized')
          if kinds['expression-body']['kind'] != 'ExpressionBodySyntax':
              raise SystemExit('ExpressionBodySyntax missing')

          d88='notas/decisiones/ADR-088-iteracion-progresiones-y-bloques-de-expresion.md'
          for s in (
              'fallo de evaluación `progression-step-zero`',
              'Una fuente que ya posee enumeración propia',
              'Los pasos predeterminados solo intervienen cuando la enumeración se construye como progresión',
              '`ForEachEffect` conserva `step?`',
              '`SelectionExpr` y `QuantifierExpr` conservan `step?`',
              'action Accumulate for values: Int [* ordered]',
              'action Forward for mut total: Num',
              'action Backward for mut total: Num',
              'La verificación concreta de intervalos discontinuos',
          ): need(d88,s)
          for s in ('process i','process doubled','use i','action Accumulate for mut total: Int {\n    then for each i in [1..10]:'):
              forbid(d88,s)

          d33='notas/decisiones/ADR-033-claves-y-enumeracion-de-aliases.md'
          need(d33,'action VisitCoordinates for mut visits: Nat')
          need(d33,'rule HasLeftEdge')
          forbid(d33,'    ...')

          d34='notas/decisiones/ADR-034-number-exacto-y-rumber-binary64.md'
          need(d34,'action InvalidRumIteration for mut total: Rum')
          forbid(d34,'for each value in [r0..r1] by r0.1: {}')

          d47='notas/decisiones/ADR-047-cuantificadores-e-iteracion-finita.md'
          need(d47,'iterations += 1')
          need(d47,'Las fuentes que ya poseen enumeración propia no necesitan fabricar un paso')
          need(d47,'El orden de recorrido de una progresión explícita es independiente')
          forbid(d47,'    ...')

          d75='notas/decisiones/ADR-075-dominios-enumerables-all-y-valores-derivados.md'
          need(d75,'Su paso es estático, firmado, no nulo, exacto')
          forbid(d75,'Su paso es estático, positivo, no nulo')

          chapter='especificacion/07-gramatica-concreta.md'
          need(chapter,'produce el fallo de evaluación `progression-step-zero`')
          need(chapter,'Una fuente con enumeración propia no necesita `by`')
          need(chapter,'Los intervalos de `Rum` nunca admiten progresión `by`')
          need(chapter,'Con orden semántico se evalúa justo antes de cada iteración')
          need(chapter,'sin orden semántico todos los filtros leen la instantánea inicial')

          q18='notas/preguntas/Q-018-intervalos-discontinuos.md'
          need(q18,'D-088 cierra el recorrido descendente explícito')
          q28='notas/preguntas/Q-028-finitud.md'
          need(q28,'  - D-088')
          need(q28,'un único periodo fundamental')

          cases_path='especificacion/sintaxis/casos/cst-ast.yaml'
          data=yaml.safe_load(r(cases_path))
          by_id={c['id']:c for c in data['cases']}
          required_ids={
            'for-each-requires-colon','for-each-negative-step','for-each-filter-expression-block',
            'for-each-static-zero-step','selection-by-expression-block','quantifier-by-expression-block',
            'sum-by-expression-block','negative-stepped-domain-all','rumber-stepped-domain-rejected',
            'magnitude-step-compatible-units','d088-for-each-body-after-terminator',
            'd088-selection-body-after-terminator','d088-quantifier-block-after-terminator',
            'd088-runtime-zero-step-action','d088-num-interval-without-step-rejected',
            'd088-infinite-interval-not-enumerable','d088-arbitrary-collection-by-is-not-stride',
            'd088-filter-must-be-bool','d088-random-filter-rejected','d088-step-evaluated-once',
            'd088-explicit-rum-collection-enumerable','d088-ordered-filter-sees-previous-effects',
            'd088-unordered-filter-sees-initial-snapshot','d088-remaining-quantifiers-with-by',
            'd088-open-lower-positive-step','d088-open-upper-negative-step',
            'd088-empty-inverted-interval-zero-iterations'
          }
          missing=sorted(required_ids-set(by_id))
          if missing: raise SystemExit(f'missing D088 cases: {missing}')

          sources={k:by_id[k]['source'] for k in required_ids if 'source' in by_id[k]}
          if '[1..5] {' in sources['for-each-requires-colon']:
              raise SystemExit('missing-colon case still has numeric progression side issue')
          if '[1..3]:' in sources['d088-for-each-body-after-terminator']:
              raise SystemExit('newline case still depends on bare numeric progression')
          if 'x in [1..3]:' in sources['d088-selection-body-after-terminator']:
              raise SystemExit('selection newline case still depends on bare numeric progression')
          if 'exists x in [1..3]:' in sources['d088-quantifier-block-after-terminator']:
              raise SystemExit('quantifier newline case still depends on bare numeric progression')
          if '[0..*]:' in sources['d088-infinite-interval-not-enumerable']:
              raise SystemExit('infinite case also lacks explicit step')
          if '[1..4] if ' in sources['d088-filter-must-be-bool'] or '[1..4] if ' in sources['d088-random-filter-rejected']:
              raise SystemExit('filter cases also lack explicit step')

          # D-087 regressions must remain fixed across the broad D-088 rewrite.
          cst='especificacion/sintaxis/cst-sin-perdidas.md'
          need(cst,'  - D-087')
          need(cst,'metadata-assignment       → MetadataAssignmentSyntax')
          forbid(cst,'IntrinsicNameOverrideSyntax')
          forbid(cst,'- `ANCHOR_INTERPOLATION_START`.')
          need(cst,'No existe `ANCHOR_INTERPOLATION_START`')
          need(cst,'Declaraciones de metadatos duplicadas en un mismo propietario, incluidas las unidades.')

          ast08='especificacion/08-sintaxis-abstracta.md'
          forbid(ast08,'- `AnchorInterpolation`.')
          need(ast08,'No existe `AnchorInterpolation`.')
          forbid(ast08,'Unidad con propiedades duplicadas.')
          need(ast08,'Declaraciones de metadatos duplicadas en una misma unidad.')

          d70='notas/decisiones/ADR-070-cst-sin-perdidas-y-ast-superficial-normalizado.md'
          need(d70,'ADR-087-metadatos-reflectivos-descriptores-estables-y-visibilidad-exterior|D-087')
          forbid(d70,'Propiedades de unidad duplicadas.')

          for case_id in (
              'immutable-metadata-assignment-rejected','metadata-path-assignment-rejected',
              'metadata-file-assignment-rejected','alias-runtime-name-metadata',
              'family-runtime-name-metadata','metadata-access-and-assignment'
          ):
              case=by_id[case_id]
              if case.get('category')!='validation-before-ast':
                  raise SystemExit(f'{case_id}: runtime metadata write phase regressed')
              if case.get('expected_diagnostics')!=['metadata-runtime-write']:
                  raise SystemExit(f'{case_id}: metadata write diagnostic regressed')
              if case.get('produces_ast') is not False:
                  raise SystemExit(f'{case_id}: runtime metadata write reaches AST')

          print('D088_V7B_STAGE1_OK')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'v7b semantic audit failed' }

      - name: Stage 2 official validators
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { throw 'decision validation failed' }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { throw 'question validation failed' }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { throw 'grammar validation failed' }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { throw 'syntax model validation failed' }
          git add -N notas/decisiones/ADR-088-iteracion-progresiones-y-bloques-de-expresion.md
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

      - name: Stage 3 exact change surface
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          $expected = @(
            'especificacion/07-gramatica-concreta.md',
            'especificacion/08-sintaxis-abstracta.md',
            'especificacion/gramatica/mud.ebnf',
            'especificacion/sintaxis/casos/cst-ast.yaml',
            'especificacion/sintaxis/cobertura-sintactica.yaml',
            'especificacion/sintaxis/cst-a-ast-superficial.md',
            'especificacion/sintaxis/cst-sin-perdidas.md',
            'especificacion/sintaxis/mud-surface-ast.asdl',
            'especificacion/sintaxis/mud-syntax-kinds.yaml',
            'notas/decisiones/ADR-033-claves-y-enumeracion-de-aliases.md',
            'notas/decisiones/ADR-034-number-exacto-y-rumber-binary64.md',
            'notas/decisiones/ADR-047-cuantificadores-e-iteracion-finita.md',
            'notas/decisiones/ADR-057-gramatica-concreta-y-continuacion.md',
            'notas/decisiones/ADR-071-vinculaciones-locales-en-bloques-booleanos.md',
            'notas/decisiones/ADR-075-dominios-enumerables-all-y-valores-derivados.md',
            'notas/decisiones/ADR-081-filtrado-take-e-indexacion-de-colecciones.md',
            'notas/decisiones/ADR-082-cycle-como-modificador-de-dominio-de-punto.md',
            'notas/decisiones/ADR-088-iteracion-progresiones-y-bloques-de-expresion.md',
            'notas/decisiones/README.md',
            'notas/preguntas/Q-018-intervalos-discontinuos.md',
            'notas/preguntas/Q-028-finitud.md'
          ) | Sort-Object
          $actual = @(git status --porcelain=v1 --untracked-files=all | ForEach-Object {
            $path=$_.Substring(3)
            if ($path -match ' -> ') { $path=($path -split ' -> ',2)[1] }
            $path.Trim('"')
          }) | Sort-Object -Unique
          $difference=Compare-Object $expected $actual
          if ($difference) {
            Write-Host 'EXPECTED:'; $expected
            Write-Host 'ACTUAL:'; $actual
            Write-Host 'DIFFERENCE:'; $difference
            throw 'unexpected D088 v7b change surface'
          }
          git diff --stat

      - name: Commit candidate
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add --all
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged diff check failed' }
          git commit -m "spec(language): define progresiones y bloques de expresión" -m "Context:`n- Integra D-088 sobre iteración, filtros, by, selección, cuantificadores y dominios escalonados.`n- Generaliza BooleanBlock a ExpressionBlock y hace obligatorio ':' antes de cuerpos subordinados.`n- Aísla los casos de conformidad para que cada diagnóstico pruebe una sola frontera.`n`nValidation:`n- auditoría semántica específica v7b`n- regresiones D-087`n- decisiones y preguntas`n- gramática`n- modelo sintáctico`n- superficie exacta`n- git diff --check"
          if ($LASTEXITCODE -ne 0) { throw 'candidate commit failed' }
          git push origin HEAD:chatgpt-d088-candidate-v7b
          if ($LASTEXITCODE -ne 0) { throw 'candidate push failed' }
