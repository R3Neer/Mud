name: ChatGPT cardinality coherence fix

on:
  push:
    branches:
      - chatgpt-d087-apply

permissions:
  contents: write

jobs:
  apply:
    name: Fix omitted cardinality coherence
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout control branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          path: control

      - name: Checkout exact main
        uses: actions/checkout@v6
        with:
          ref: e283529dd46cd90513dd760b6dc4b91e95cf7b93
          fetch-depth: 0
          persist-credentials: true
          path: Mud

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify exact base
        shell: pwsh
        env:
          EXPECTED_HEAD: e283529dd46cd90513dd760b6dc4b91e95cf7b93
        run: |
          $ErrorActionPreference = 'Stop'
          git -C Mud fetch origin main
          $remote = (git -C Mud rev-parse origin/main).Trim()
          $local = (git -C Mud rev-parse HEAD).Trim()
          if ($remote -ne $env:EXPECTED_HEAD) { throw "main moved: expected $env:EXPECTED_HEAD, found $remote" }
          if ($local -ne $env:EXPECTED_HEAD) { throw "checkout mismatch: expected $env:EXPECTED_HEAD, found $local" }

      - name: Apply cardinality coherence correction
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location Mud
          try {
            python ../control/.chatgpt/fix-cardinality.py
            if ($LASTEXITCODE -ne 0) { throw 'cardinality correction failed' }
          }
          finally { Pop-Location }

      - name: Verify exact change surface
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $actual = @(git -C Mud status --porcelain=v1 --untracked-files=all)
          $expected = @(
            ' M especificacion/08-sintaxis-abstracta.md',
            ' M especificacion/sintaxis/casos/cst-ast.yaml'
          )
          if (($actual -join "`n") -ne ($expected -join "`n")) {
            Write-Host 'Actual status:'
            $actual | ForEach-Object { Write-Host $_ }
            throw 'unexpected change surface'
          }

      - name: Run coherence assertions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location Mud
          try {
            @'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def require(path, needle):
              if needle not in read(path):
                  raise SystemExit(f"MISSING in {path}: {needle}")

          def forbid(path, needle):
              if needle in read(path):
                  raise SystemExit(f"FORBIDDEN in {path}: {needle}")

          grammar = "especificacion/gramatica/mud.ebnf"
          require(grammar, 'metadata-name     ::= identifier | "for" | "on" | "given" ;')
          require(grammar, 'assignable-expression\n    ::= primary-expression , { member-access | index-access } ;')
          forbid(grammar, "unit-property")
          forbid(grammar, "prefix-selection")

          surface = "especificacion/sintaxis/mud-surface-ast.asdl"
          for stale in ("MetadataAttachment", "metadata_attachment", "UnitProperties", "unit_properties", "PrefixPolicy", "prefix_policy", "MetadataSuffix"):
              forbid(surface, stale)
          require(surface, "metadata_assignment* metadata_defaults")
          require(surface, "cardinality_origin = WrittenCardinality | OmittedCardinality")
          require(surface, "RootUnitDecl(identifier_name name,")
          require(surface, "metadata_assignment* metadata)")

          resolved = "especificacion/sintaxis/mud-resolved-ast.asdl"
          forbid(resolved, "WritesMetadata")
          require(resolved, "ReadsMetadata")

          kinds = "especificacion/sintaxis/mud-syntax-kinds.yaml"
          require(kinds, 'rhs: primary-expression , { member-access | index-access }')
          require(kinds, 'member-access | metadata-access | index-access | call-arguments')
          forbid(kinds, "  unit-property:")

          projection = "especificacion/sintaxis/cst-a-ast-superficial.md"
          require(projection, "ambas formas producen un `CollectionSpec` con `OmittedCardinality`")
          require(projection, "Las unidades no tienen una normalización `UnitProperties` separada.")
          require(projection, "Toda interpolación produce `ValueInterpolation`; `anchor{...}` no pertenece al lenguaje.")

          cases = "especificacion/sintaxis/casos/cst-ast.yaml"
          require(cases, '- id: metadata-access-and-assignment\n  category: validation-before-ast')
          require(cases, "metadata-runtime-write")
          require(cases, "metadata-clause-properties-use-hard-keywords")
          require(cases, "StoredMetadataAssignment(prefixes, AllLiteral)")
          require(cases, '- id: cardinality-omitted\n  category: collection')
          require(cases, 'ast: StoredFieldDecl(value, cardinalityOrigin=OmittedCardinality)')
          forbid(cases, "omitted-cardinality-to-one")

          abstract = "especificacion/08-sintaxis-abstracta.md"
          require(abstract, "`cardinalityOrigin = OmittedCardinality`")
          forbid(abstract, "Omisión → `[1..1]` sintético.")
          require(abstract, "No existe `UnitProperties` ni `PrefixPolicy`")

          concrete = "especificacion/07-gramatica-concreta.md"
          require(concrete, "Todo participante `for`, `on` y `given` tiene identificador explícito.")
          require(concrete, "Todo acceso `~` es runtime-readonly")
          require(concrete, '| `~for` | `Participant [* unique ordered]`')

          names = "especificacion/09-nombres-y-anclas.md"
          require(names, "entidad semántica persistente a la que la especificación asigna identidad pública")
          require(names, "Todo participante `for`, `on` y `given` tiene nombre y ancla subordinada")

          adr87 = "notas/decisiones/ADR-087-metadatos-reflectivos-descriptores-estables-y-visibilidad-exterior.md"
          require(adr87, "Ninguna propiedad `~` puede aparecer como destino de una asignación o actualización runtime.")
          require(adr87, "~prefixes     : Prefix [* unique] = empty")

          print("COHERENCE_ASSERTIONS_OK")
          '@ | python -
            if ($LASTEXITCODE -ne 0) { throw 'coherence assertions failed' }
          }
          finally { Pop-Location }

      - name: Run repository validators
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
          python Mud/tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { throw 'decision validation failed' }
          python Mud/tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { throw 'question validation failed' }
          python Mud/especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { throw 'grammar validation failed' }
          python Mud/especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { throw 'syntax model validation failed' }
          git -C Mud diff --check
          if ($LASTEXITCODE -ne 0) { throw 'git diff --check failed' }

      - name: Commit and fast-forward main
        shell: pwsh
        env:
          EXPECTED_HEAD: e283529dd46cd90513dd760b6dc4b91e95cf7b93
        run: |
          $ErrorActionPreference = 'Stop'
          git -C Mud config user.name "ChatGPT"
          git -C Mud config user.email "chatgpt@users.noreply.github.com"
          git -C Mud add -- especificacion/08-sintaxis-abstracta.md especificacion/sintaxis/casos/cst-ast.yaml
          git -C Mud diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged diff check failed' }
          git -C Mud commit -m "fix(syntax): conserva cardinalidad omitida en AST"
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git -C Mud fetch origin main
          $remote = (git -C Mud rev-parse origin/main).Trim()
          if ($remote -ne $env:EXPECTED_HEAD) { throw "main moved before push: expected $env:EXPECTED_HEAD, found $remote" }
          git -C Mud push origin HEAD:main
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
