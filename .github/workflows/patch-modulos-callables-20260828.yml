name: Patch módulos, callables y activación

on:
  pull_request:
    branches:
      - control/patch-modulos-callables-20260828

permissions:
  contents: write
  pull-requests: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidata
        uses: actions/checkout@v4
        with:
          ref: patch/modulos-callables-message-20260828-v2
          path: candidate
          fetch-depth: 0

      - name: Checkout laboratorio
        uses: actions/checkout@v4
        with:
          ref: control/patch-modulos-callables-20260828
          path: control
          fetch-depth: 1

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Dependencias de validación
        working-directory: candidate
        run: python -m pip install -r especificacion/sintaxis/requirements.txt

      - name: Aplicar transformación determinista
        working-directory: candidate
        run: |
          if grep -q 'StartSet(expr\* contributions)' especificacion/sintaxis/mud-surface-ast.asdl; then
            echo 'La candidata ya contiene la transformación estructural.'
          else
            python ../control/gobierno/labs/patch_modulos_callables_20260828.py
          fi
          python ../control/gobierno/labs/patch_modulos_callables_postfix_20260828.py
          python ../control/gobierno/labs/patch_modulos_callables_residuos_20260828.py
          python ../control/gobierno/labs/patch_modulos_callables_coherence_20260828.py
          rm -f gobierno/labs/d096-v2-trigger.txt

      - name: Regenerar índices oficiales
        working-directory: candidate
        run: |
          python tooling/decisions/manage_decisions.py generate
          python tooling/questions/validate_questions.py generate

      - name: Invariantes específicos D-096
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          grep -q '^id: D-096$' notas/decisiones/ADR-096-modulos-callables-look-message-y-activacion.md
          grep -q '^status: sustituida$' notas/decisiones/ADR-027-salidas-look-y-message.md
          grep -q '^  - "D-096"$' notas/decisiones/ADR-027-salidas-look-y-message.md
          grep -q 'StartSet(expr\* contributions)' especificacion/sintaxis/mud-surface-ast.asdl
          grep -q '| EnumerateAll' especificacion/sintaxis/mud-surface-ast.asdl
          grep -q 'given_clause? givens' especificacion/sintaxis/mud-surface-ast.asdl
          grep -q 'semantic_module\* modules' especificacion/ir/mud-semantic-ir.asdl
          ! grep -q 'PrivateMetadata' especificacion/ir/mud-semantic-ir.asdl
          ! grep -q '"things" , start-contribution-body' especificacion/gramatica/mud.ebnf
          ! grep -q '"rules" , start-contribution-body' especificacion/gramatica/mud.ebnf
          grep -q '"allowed" | "all"' especificacion/gramatica/mud.ebnf
          for q in 062 063 064 065 066 067 068; do
            grep -q "^id: Q-$q$" notas/preguntas/Q-$q-*.md
            grep -q '^resolved: false$' notas/preguntas/Q-$q-*.md
          done
          grep -q '^resolved: true$' notas/preguntas/Q-051-identidad-y-seleccion-de-un-look.md
          grep -q '^resolved: true$' notas/preguntas/Q-052-entrega-de-message.md
          ! grep -q 'gobierno/labs/d096-v2-trigger.txt' < <(git status --short)
          ! find .github/workflows -maxdepth 1 -name 'patch-modulos-callables-20260828.yml' -print -quit | grep -q .

      - name: Validadores oficiales
        working-directory: candidate
        run: |
          python tooling/decisions/manage_decisions.py validate
          python tooling/questions/validate_questions.py validate
          python especificacion/gramatica/validate_grammar.py
          python especificacion/sintaxis/validate_syntax_model.py
          git diff --check

      - name: Auditorías globales de residuos D-096
        working-directory: candidate
        run: |
          python ../control/gobierno/labs/audit_modulos_callables_residuos_20260828.py
          python ../control/gobierno/labs/audit_modulos_callables_coherence_20260828.py

      - name: Auditoría de superficie generada
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          echo 'Rutas modificadas respecto al HEAD de entrada:'
          git status --short
          if grep -R -n --include='*.asdl' 'PrivateMetadata' especificacion; then
            exit 1
          fi
          if grep -R -n --include='*.md' --include='*.ebnf' 'Reglas reactivas, `always`, `look` y `message` no admiten `given`' .; then
            exit 1
          fi

      - name: Commit de la candidata cuando haya cambios
        working-directory: candidate
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name 'MUD Patch Bot'
            git config user.email 'mud-patch-bot@users.noreply.github.com'
            git add -A
            git commit -m 'spec(language): integra módulos, callables y activación'
            git push origin HEAD:patch/modulos-callables-message-20260828-v2
          else
            echo 'La candidata ya coincide con la transformación validada.'
          fi
