name: ChatGPT global coherence resume phase 5 v7
on:
  push:
    branches: [chatgpt-global-coherence-resume-runner-p]
permissions: {contents: write}
jobs:
  residue-cleanup:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-resume-runner-p, path: runner, fetch-depth: 0}
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-resume-20260816-j, path: target, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Base exacta
        shell: pwsh
        working-directory: target
        env: {BASE: 942d0d0e6c17ce04bbc6e9b091fe71fda3bc4eb9}
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:BASE){throw 'base mismatch'}
          if(git status --porcelain=v1 --untracked-files=all){throw 'dirty base'}
      - name: Transformación
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force tooling/chatgpt | Out-Null
          Copy-Item ../runner/tooling/chatgpt/resume_phase5_residue_cleanup.py tooling/chatgpt/x.py
          Copy-Item ../runner/tooling/chatgpt/resume_phase5_review_fix.py tooling/chatgpt/r.py
          Copy-Item ../runner/tooling/chatgpt/resume_phase5_deep_residue_cleanup.py tooling/chatgpt/d.py
          python tooling/chatgpt/x.py; if($LASTEXITCODE){throw 'transform'}
          python tooling/chatgpt/r.py; if($LASTEXITCODE){throw 'review fix'}
          python tooling/chatgpt/d.py; if($LASTEXITCODE){throw 'deep cleanup'}
          Remove-Item tooling/chatgpt/x.py,tooling/chatgpt/r.py,tooling/chatgpt/d.py
          python tooling/decisions/manage_decisions.py generate; if($LASTEXITCODE){throw 'decisions generate'}
      - name: Invariantes de residuos
        shell: pwsh
        working-directory: target
        run: |
          Copy-Item ../runner/tooling/chatgpt/resume_phase5_deep_invariants.py ./invariants.py
          python invariants.py; if($LASTEXITCODE){throw 'invariants'}
          Remove-Item invariants.py
      - name: Validadores oficiales
        shell: pwsh
        working-directory: target
        run: |
          python tooling/decisions/manage_decisions.py validate; if($LASTEXITCODE){throw 'decisions'}
          python tooling/questions/validate_questions.py; if($LASTEXITCODE){throw 'questions'}
          python especificacion/gramatica/validate_grammar.py; if($LASTEXITCODE){throw 'grammar'}
          python especificacion/sintaxis/validate_syntax_model.py; if($LASTEXITCODE){throw 'syntax'}
          git diff --check; if($LASTEXITCODE){throw 'diff'}
      - name: Superficie exacta
        shell: pwsh
        working-directory: target
        run: |
          $allowed=@(
            'notas/decisiones/ADR-015-especializacion-aciclica-y-estado-independiente.md',
            'notas/decisiones/ADR-028-sistema-de-magnitudes-y-unidades.md',
            'notas/decisiones/ADR-035-organizacion-nombres-using-y-anclas.md',
            'notas/decisiones/ADR-036-participantes-receptores-y-llamadas.md',
            'notas/decisiones/ADR-038-familias-cerradas-de-valores.md',
            'notas/decisiones/ADR-061-resultados-fallidos-y-plantillas-text.md',
            'notas/decisiones/ADR-063-firmas-given-y-vinculaciones-on-conjuntas.md',
            'notas/decisiones/ADR-068-thing-universal-y-nombre-intrinseco.md',
            'notas/decisiones/ADR-070-cst-sin-perdidas-y-ast-superficial-normalizado.md',
            'notas/decisiones/ADR-072-entornos-de-resolucion-y-migraciones-explicitas-de-anclas.md',
            'notas/decisiones/ADR-078-resolucion-nominal-anclas-y-grafo-inicial.md',
            'notas/decisiones/ADR-085-diccionarios-decisionales-metadatos-y-activacion-estructurada.md',
            'notas/decisiones/ADR-087-metadatos-reflectivos-descriptores-estables-y-visibilidad-exterior.md',
            'notas/decisiones/README.md',
            'especificacion/07-gramatica-concreta.md',
            'especificacion/README.md',
            'especificacion/sintaxis/casos/cst-ast.yaml',
            'especificacion/sintaxis/cobertura-sintactica.yaml'
          )
          $actual=@(git status --porcelain=v1 --untracked-files=all|%{$p=$_.Substring(3);if($p -match ' -> '){$p=($p -split ' -> ',2)[1]};$p.Trim('"')})|Sort-Object -Unique
          foreach($p in $actual){if($allowed -notcontains $p){throw "unexpected $p"}}
          if($actual.Count -ne $allowed.Count){throw "changed-path count mismatch: $($actual.Count)"}
          foreach($p in $allowed){if($actual -notcontains $p){throw "missing expected change $p"}}
          git diff --stat
      - name: Commit candidato
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add --all
          git diff --cached --check; if($LASTEXITCODE){throw 'staged diff'}
          git commit -m "fix(spec): elimina residuos reflectivos históricos" -m "Alinea ADR vigentes, especificación y casos con el modelo actual: participantes nombrados y anclados, presentación mediante ~name, unidades configuradas por metadata, anclas vía ~anchor sin anchor{...}, metadata runtime-readonly y ramas sin ancla pública.`n`nValidation: invariantes profundas de residuos, decisiones, preguntas, gramática, sintaxis y git diff --check."; if($LASTEXITCODE){throw 'commit'}
          git push origin HEAD:chatgpt-global-coherence-resume-20260816-j; if($LASTEXITCODE){throw 'push'}
