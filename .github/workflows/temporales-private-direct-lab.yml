name: Temporales y private direct lab

on:
  push:
    branches:
      - patch/temporales-private-20260828

permissions:
  contents: write

concurrency:
  group: temporales-private-direct
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout candidata
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Preparar entorno y retirar laboratorio del working tree
        run: |
          python -m pip install --quiet pyyaml
          git config user.name "MUD Editorial Bot"
          git config user.email "mud-editorial-bot@users.noreply.github.com"
          cp gobierno/labs/temporales-private-20260828/apply.py "$RUNNER_TEMP/apply.py"
          rm -f .github/workflows/temporales-private-direct-lab.yml
          rm -f gobierno/labs/temporales-private-20260828/apply.py
          rm -f gobierno/labs/temporales-private-20260828/TRIGGER.md

      - name: Eliminar excepcionalidad de private
        run: |
          set +e
          private_output=$(python "$RUNNER_TEMP/apply.py" private --root . 2>&1)
          private_rc=$?
          set -e
          printf '%s\n' "$private_output"
          if [ "$private_rc" -ne 0 ] && [[ "$private_output" != *"quedan apariciones de ~private: notas/decisiones/ADR-096-modulos-callables-look-message-y-activacion.md"* ]]; then
            exit "$private_rc"
          fi
          python - <<'PY'
          from pathlib import Path
          path = Path('notas/decisiones/ADR-096-modulos-callables-look-message-y-activacion.md')
          text = path.read_text(encoding='utf-8')
          old = '- No existen modificadores explícitos `public`, `private`, `internal` ni `~private` para controlar la frontera modular.\n'
          new = '- La frontera modular no se controla mediante modificadores explícitos de visibilidad.\n'
          if old not in text:
              raise SystemExit('No se encontró el último residuo esperado de visibilidad en D-096')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          for raw in [
              'especificacion/07-gramatica-concreta.md',
              'notas/decisiones/ADR-087-metadatos-reflectivos-descriptores-estables-y-visibilidad-exterior.md',
              'notas/decisiones/ADR-091-datos-de-family-como-descriptores-anclados.md',
              'notas/decisiones/ADR-096-modulos-callables-look-message-y-activacion.md',
              'notas/inventario-saneamiento-especificacion.md',
          ]:
              p = Path(raw)
              value = p.read_text(encoding='utf-8')
              p.write_text(value.rstrip('\n') + '\n', encoding='utf-8')
          PY
          if git grep -n -F '~private' -- .; then
            echo "Quedan menciones explícitas a ~private" >&2
            exit 1
          fi
          python tooling/decisions/manage_decisions.py validate
          python tooling/questions/validate_questions.py
          python especificacion/gramatica/validate_grammar.py
          python especificacion/sintaxis/validate_syntax_model.py
          git diff --check
          git add especificacion/07-gramatica-concreta.md notas/decisiones/ADR-087-metadatos-reflectivos-descriptores-estables-y-visibilidad-exterior.md notas/decisiones/ADR-091-datos-de-family-como-descriptores-anclados.md notas/decisiones/ADR-096-modulos-callables-look-message-y-activacion.md notas/inventario-saneamiento-especificacion.md
          git diff --cached --check
          git commit -m "fix(editorial): elimina la excepcionalidad de private"

      - name: Establecer gobernanza de temporales
        run: |
          python "$RUNNER_TEMP/apply.py" govern --root .
          python - <<'PY'
          from pathlib import Path
          validator = Path('gobierno/validate_temporaries.py')
          text = validator.read_text(encoding='utf-8')
          old = '    return sorted(root / item.decode("utf-8") for item in completed.stdout.split(b"\\0") if item)\n'
          new = '    paths = (root / item.decode("utf-8") for item in completed.stdout.split(b"\\0") if item)\n    return sorted(path for path in paths if path.is_file())\n'
          if old not in text:
              raise SystemExit('No se encontró el retorno esperado de markdown_files')
          validator.write_text(text.replace(old, new, 1), encoding='utf-8')
          for raw in [
              'AGENTS.md',
              'gobierno/POLITICA-DE-COMMITS.md',
              'gobierno/POLITICA-DE-ARCHIVOS-TEMPORALES.md',
              'gobierno/README.md',
              'gobierno/temporales.base',
              'gobierno/validate_temporaries.py',
              'notas/inventario-saneamiento-especificacion.md',
          ]:
              p = Path(raw)
              value = p.read_text(encoding='utf-8')
              p.write_text(value.rstrip('\n') + '\n', encoding='utf-8')
          PY
          python gobierno/validate_temporaries.py
          python - <<'PY'
          import yaml
          from pathlib import Path
          data = yaml.safe_load(Path('gobierno/temporales.base').read_text(encoding='utf-8'))
          assert data['filters']['and'] == ['temporary == true']
          assert [view['name'] for view in data['views']] == ['Temporales activos', 'Con fecha límite', 'Metadata incompleta']
          PY
          tmp=$(mktemp -d)
          cat > "$tmp/valid.md" <<'EOF'
          ---
          temporary: true
          temporary-reason: "Fixture válido"
          temporary-delete-when: "Termine la prueba"
          temporary-delete-after: 2099-12-31
          ---
          EOF
          python gobierno/validate_temporaries.py --root "$tmp"
          cat > "$tmp/missing.md" <<'EOF'
          ---
          temporary: true
          temporary-delete-when: "Termine la prueba"
          ---
          EOF
          if python gobierno/validate_temporaries.py --root "$tmp" >/dev/null 2>&1; then exit 1; fi
          rm "$tmp/missing.md"
          cat > "$tmp/false.md" <<'EOF'
          ---
          temporary: false
          ---
          EOF
          if python gobierno/validate_temporaries.py --root "$tmp" >/dev/null 2>&1; then exit 1; fi
          rm "$tmp/false.md"
          cat > "$tmp/orphan.md" <<'EOF'
          ---
          temporary-reason: "Sin flag"
          ---
          EOF
          if python gobierno/validate_temporaries.py --root "$tmp" >/dev/null 2>&1; then exit 1; fi
          rm "$tmp/orphan.md"
          cat > "$tmp/expired.md" <<'EOF'
          ---
          temporary: true
          temporary-reason: "Fixture vencido"
          temporary-delete-when: "Llegue la fecha"
          temporary-delete-after: 2000-01-01
          ---
          EOF
          if python gobierno/validate_temporaries.py --root "$tmp" >/dev/null 2>&1; then exit 1; fi
          rm -rf "$tmp"
          if grep -Fq '> [!warning] Artefacto temporal' notas/inventario-saneamiento-especificacion.md; then exit 1; fi
          if grep -Fq 'eliminar `notas/inventario-saneamiento-especificacion.md`' notas/inventario-saneamiento-especificacion.md; then exit 1; fi
          git diff --check
          git add AGENTS.md gobierno/POLITICA-DE-COMMITS.md gobierno/POLITICA-DE-ARCHIVOS-TEMPORALES.md gobierno/README.md gobierno/temporales.base gobierno/validate_temporaries.py notas/inventario-saneamiento-especificacion.md
          git diff --cached --check
          git commit -m "govern(git): establece ciclo de archivos temporales"

      - name: Validación integral
        run: |
          python tooling/decisions/manage_decisions.py validate
          python tooling/questions/validate_questions.py
          python especificacion/gramatica/validate_grammar.py
          python especificacion/sintaxis/validate_syntax_model.py
          python gobierno/validate_temporaries.py
          if git grep -n -F '~private' -- .; then exit 1; fi
          git diff HEAD~2..HEAD --check

      - name: Retirar infraestructura de laboratorio
        run: |
          git add -u .github/workflows/temporales-private-direct-lab.yml gobierno/labs/temporales-private-20260828/apply.py gobierno/labs/temporales-private-20260828/TRIGGER.md
          git commit -m "chore(lab): retira infraestructura temporal"
          test -z "$(git status --porcelain)"

      - name: Publicar candidata validada
        run: git push origin HEAD:patch/temporales-private-20260828
