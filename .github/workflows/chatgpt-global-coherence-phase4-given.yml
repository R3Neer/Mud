name: ChatGPT global coherence phase 4 given
on:
  push:
    branches: [chatgpt-global-coherence-runner-v4-given]
permissions: {contents: write}
jobs:
  given:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-runner-v4-given, path: runner, fetch-depth: 0}
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-20260816-v3, path: target, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Base exacta
        shell: pwsh
        working-directory: target
        env: {BASE: ac1850284f1692d9b8cc36936fa144a4568e82be}
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:BASE){throw 'base mismatch'}
          if(git status --porcelain=v1 --untracked-files=all){throw 'dirty base'}
      - name: Transformación
        shell: pwsh
        working-directory: target
        run: |
          New-Item -ItemType Directory -Force tooling/chatgpt | Out-Null
          Copy-Item ../runner/tooling/chatgpt/global_coherence_phase4_given.py tooling/chatgpt/x.py
          python tooling/chatgpt/x.py; if($LASTEXITCODE){throw 'transform'}
          Remove-Item tooling/chatgpt/x.py
          python tooling/decisions/manage_decisions.py generate; if($LASTEXITCODE){throw 'decisions generate'}
      - name: Invariantes
        shell: pwsh
        working-directory: target
        run: |
          @'
          from pathlib import Path
          def r(p): return Path(p).read_text(encoding='utf-8')
          g=r('especificacion/gramatica/mud.ebnf')
          assert 'given-name , { "," , given-name } , ":" , given-type-expression' in g
          for x in ('given-type-expression','given-dictionary-type','given-dictionary-link','given-dictionary-value-type'):
              assert f'{x}\n    ::=' in g
          assert 'given-name , { "," , given-name } , ":" , union-type-expression' not in g
          k=r('especificacion/sintaxis/mud-syntax-kinds.yaml')
          for x in ('GivenTypeExpressionSyntax','GivenDictionaryTypeSyntax','GivenDictionaryLinkSyntax','GivenDictionaryValueTypeSyntax'):
              assert x in k, x
          cov=r('especificacion/sintaxis/cobertura-sintactica.yaml')
          for x in ('given-type-expression:','given-dictionary-type:','given-dictionary-link:','given-dictionary-value-type:'):
              assert x in cov, x
          d=r('notas/decisiones/ADR-063-firmas-given-y-vinculaciones-on-conjuntas.md')
          assert 'puede ser un diccionario exacto o decisional' in d
          assert 'D-092' in d
          d92=r('notas/decisiones/ADR-092-tipos-readonly-completos-en-given.md')
          assert 'ningún `collection-specification`' in d92 and 'a ninguna profundidad' in d92
          c=r('especificacion/sintaxis/casos/cst-ast.yaml')
          for x in ('id: given-exact-dictionary','id: given-decision-dictionary-ordered','id: given-hidden-mut-invalid'):
              assert x in c
          print('PHASE4_GIVEN_INVARIANTS_OK')
          '@ | python -
          if($LASTEXITCODE){throw 'invariants'}
      - name: Validadores
        shell: pwsh
        working-directory: target
        run: |
          python tooling/decisions/manage_decisions.py validate; if($LASTEXITCODE){throw 'decisions'}
          python tooling/questions/validate_questions.py; if($LASTEXITCODE){throw 'questions'}
          python especificacion/gramatica/validate_grammar.py; if($LASTEXITCODE){throw 'grammar'}
          python especificacion/sintaxis/validate_syntax_model.py; if($LASTEXITCODE){throw 'syntax'}
          git diff --check; if($LASTEXITCODE){throw 'diff'}
      - name: Superficie
        shell: pwsh
        working-directory: target
        run: |
          $allowed=@('notas/decisiones/ADR-092-tipos-readonly-completos-en-given.md','notas/decisiones/ADR-063-firmas-given-y-vinculaciones-on-conjuntas.md','notas/decisiones/README.md','especificacion/gramatica/mud.ebnf','especificacion/sintaxis/mud-syntax-kinds.yaml','especificacion/sintaxis/cobertura-sintactica.yaml','especificacion/sintaxis/cst-a-ast-superficial.md','especificacion/sintaxis/casos/cst-ast.yaml','especificacion/07-gramatica-concreta.md','especificacion/08-sintaxis-abstracta.md')
          $actual=@(git status --porcelain=v1 --untracked-files=all|%{$p=$_.Substring(3);if($p -match ' -> '){$p=($p -split ' -> ',2)[1]};$p.Trim('"')})|Sort-Object -Unique
          foreach($p in $actual){if($allowed -notcontains $p){throw "unexpected $p"}}
          git diff --stat
      - name: Commit candidato
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT; git config user.email chatgpt@users.noreply.github.com
          git add --all; git diff --cached --check; if($LASTEXITCODE){throw 'staged diff'}
          git commit -m "spec(grammar): admite diccionarios readonly en given" -m "D-092 corrige la restricción accidental de given sin permitir mutabilidad directa ni anidada.`n`nValidation: invariantes, decisiones, preguntas, gramática, sintaxis y diff check."; if($LASTEXITCODE){throw 'commit'}
          git push origin HEAD:chatgpt-global-coherence-20260816-v3; if($LASTEXITCODE){throw 'push'}
