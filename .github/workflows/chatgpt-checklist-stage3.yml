name: ChatGPT checklist metadata capabilities
on:
  push:
    branches: [chatgpt-checklist-finish-stage3-runner]
permissions:
  contents: write
jobs:
  metadata:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-finish-stage3-runner
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-finish-v1
          path: target
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Apply metadata contract
        shell: pwsh
        env:
          MUD_TARGET: ${{ github.workspace }}\target
        run: python control/.chatgpt/stage3_metadata.py
      - name: Validate
        shell: pwsh
        working-directory: target
        run: |
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit 1 }
          @'
          from pathlib import Path
          import yaml
          d94=Path('notas/decisiones/ADR-094-anclas-terminales-de-metadatos-configurados.md').read_text(encoding='utf-8')
          for x in ['~anchor: Anchor','~path: MudPath','~file: MudFile','no expone `~metadata`']:
              if x not in d94: raise SystemExit(f'D094 missing {x}')
          d87=Path('notas/decisiones/ADR-087-metadatos-reflectivos-descriptores-estables-y-visibilidad-exterior.md').read_text(encoding='utf-8')
          for x in ['~path        : MudPath','~file        : MudFile','Metadata` continúa siendo terminal']:
              if x not in d87: raise SystemExit(f'D087 missing {x}')
          cases=yaml.safe_load(Path('especificacion/sintaxis/casos/cst-ast.yaml').read_text(encoding='utf-8'))['cases']
          ids={c['id'] for c in cases}
          if not {'metadata-descriptor-path-file','metadata-descriptor-remains-terminal'} <= ids: raise SystemExit('metadata cases missing')
          print('STAGE3_AUDIT_OK')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Commit and push
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add --all
          git commit -m 'spec(metadata): añade path y file al descriptor' 
          git push origin HEAD:chatgpt-checklist-finish-v1
