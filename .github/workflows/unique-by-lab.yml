              text = read(path)
              actual = text.count(marker)
              if actual != count:
                  raise SystemExit(f'{path}: expected {count} marker occurrence(s), found {actual}: {marker[:120]!r}')
              write(path, text.replace(marker, marker + addition, count))

          def replace_between(path, start, end, replacement):
              text = read(path)
              i = text.find(start)
              if i < 0:
                  raise SystemExit(f'{path}: start marker missing: {start!r}')
              j = text.find(end, i + len(start))
              if j < 0:
                  raise SystemExit(f'{path}: end marker missing: {end!r}')
              write(path, text[:i] + replacement + text[j:])

