name: ChatGPT fix stale AnchorInterpolation

on:
  push:
    branches:
      - chatgpt-fix-anchorinterp-runner

permissions:
  contents: write

jobs:
  fix:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v6
        with:
          ref: chatgpt-fix-anchorinterp-candidate
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install validation dependency
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
          if ($LASTEXITCODE -ne 0) { throw 'PyYAML installation failed' }

      - name: Verify base and fix prose
        shell: pwsh
        env:
          BASE: 100c7d5aaacea364de07d4f00edfc7fed4dc5501
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:BASE) { throw 'base mismatch' }
          @'
          from pathlib import Path
          p = Path('especificacion/08-sintaxis-abstracta.md')
          text = p.read_text(encoding='utf-8')
          old = '- `TextFragment` con texto decodificado.\n- `ValueInterpolation`.\n- `AnchorInterpolation`.\n'
          new = '- `TextFragment` con texto decodificado.\n- `ValueInterpolation`.\n'
          if text.count(old) != 1:
              raise SystemExit(f'expected one stale template list, found {text.count(old)}')
          text = text.replace(old, new, 1)
          p.write_text(text.rstrip('\n') + '\n', encoding='utf-8', newline='\n')
          if 'AnchorInterpolation' in p.read_text(encoding='utf-8'):
              raise SystemExit('stale AnchorInterpolation remains in 08')
          print('ANCHOR_INTERPOLATION_PROSE_FIXED')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'prose fix failed' }

      - name: Validate repository
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { throw 'decision validation failed' }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { throw 'question validation failed' }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { throw 'grammar validation failed' }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { throw 'syntax validation failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
          $paths = @(git diff --name-only)
          if ($paths.Count -ne 1 -or $paths[0] -ne 'especificacion/08-sintaxis-abstracta.md') { throw "unexpected surface: $($paths -join ', ')" }

      - name: Commit fix
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name "ChatGPT"
          git config user.email "chatgpt@users.noreply.github.com"
          git add especificacion/08-sintaxis-abstracta.md
          git commit -m "fix(syntax): retira AnchorInterpolation residual"
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:chatgpt-fix-anchorinterp-candidate
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
