name: Build unique-by candidate v4

on:
  push:
    branches:
      - chatgpt/unique-by-work-20260908-a1a85b9

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tooling/requirements.txt

      - name: Install official tooling dependencies
        run: python -m pip install -r tooling/requirements.txt

      - name: Run corrected isolated build script
        env:
          BASE_SHA: a1a85b90592e4621d8ddc28af4a2b03bb6f54e59
          CANDIDATE_BRANCH: chatgpt/unique-by-candidate-v4-20260908-a1a85b9
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/unique-by-lab.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          start = source.index(marker) + len(marker)
          body_lines = []
          for line in source[start:].splitlines():
              if line.startswith('          '):
                  body_lines.append(line[10:])
              elif not line.strip():
                  body_lines.append('')
              else:
                  break
          body = '\n'.join(body_lines) + '\n'
          fixes = {
              "# ADR-075 — Enumerable domains, `all` and derived value form\\n": "# ADR-075 — Enumerable domains, `all` and derived-value form\\n",
              "# ADR-086 — Exact nominal identity, external arrows and dictionary algebra\\n": "# ADR-086 — Exact nominal identity, outer arrows and dictionary algebra\\n",
          }
          for old, new in fixes.items():
              if body.count(old) != 1:
                  raise SystemExit(f'expected one build-script marker, found {body.count(old)}: {old!r}')
              body = body.replace(old, new, 1)
          body = body.replace('chatgpt/unique-by-candidate-20260908-a1a85b9', 'chatgpt/unique-by-candidate-v4-20260908-a1a85b9')
          Path('/tmp/unique-by-build.sh').write_text(body, encoding='utf-8')
          PY
          bash /tmp/unique-by-build.sh
