name: ChatGPT global coherence phase 5 extrema
on:
  push:
    branches: [chatgpt-global-coherence-runner-v5-extrema]
permissions: {contents: write}
jobs:
  extrema:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-runner-v5-extrema, path: runner, fetch-depth: 0}
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-20260816-v3, path: target, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: "3.13"}
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Base exacta
        shell: pwsh
        working-directory: target
        env: {BASE: c2e06a9bfd313e3f41c1669ea4a6b5bdc15eb5b9}
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:BASE){throw 'base mismatch'}
          if(git status --porcelain=v1 --untracked-files=all){throw 'dirty base'}
      - name: Transformación
        shell: pwsh
        working-directory: target
        run: |
          New-Item -ItemType Directory -Force tooling/chatgpt | Out-Null
          Copy-Item ../runner/tooling/chatgpt/global_coherence_phase5_extrema.py tooling/chatgpt/x.py
          python tooling/chatgpt/x.py; if($LASTEXITCODE){throw 'transform'}
          Remove-Item tooling/chatgpt/x.py
          python tooling/decisions/manage_decisions.py generate; if($LASTEXITCODE){throw 'decisions generate'}
      - name: Invariantes
        shell: pwsh
        working-directory: target
        run: |
          @'
          from pathlib import Path
          def r(p): return Path(p).read_text(encoding='utf-8')
          d47=r('notas/decisiones/ADR-047-cuantificadores-e-iteracion-finita.md')
          assert 'error definido para agregación vacía' not in d47
          assert '`min` y `max` son consultas parciales' in d47
          assert 'D-093' in d47
          d93=r('notas/decisiones/ADR-093-extremos-vacios-como-ausencia-ordinaria.md')
          assert 'T [0..1]' in d93 and 'no introduce por sí misma `failed`' in d93
          a=r('especificacion/08-sintaxis-abstracta.md')
          assert '## Resultado de `min` y `max`' in a
          c=r('especificacion/sintaxis/casos/cst-ast.yaml')
          assert 'id: min-empty-is-empty' in c and 'id: max-empty-is-empty' in c
          assert 'empty-source-produces-empty' in c
          print('PHASE5_EXTREMA_INVARIANTS_OK')
          '@ | python -
          if($LASTEXITCODE){throw 'invariants'}
      - name: Validadores
        shell: pwsh
        working-directory: target
        run: |
          python tooling/decisions/manage_decisions.py validate; if($LASTEXITCODE){throw 'decisions'}
          python tooling/questions/validate_questions.py; if($LASTEXITCODE){throw 'questions'}
          python especificacion/gramatica/validate_grammar.py; if($LASTEXITCODE){throw 'grammar'}
          python especificacion/sintaxis/validate_syntax_model.py; if($LASTEXITCODE){throw 'syntax'}
          git diff --check; if($LASTEXITCODE){throw 'diff'}
      - name: Superficie
        shell: pwsh
        working-directory: target
        run: |
          $allowed=@('notas/decisiones/ADR-093-extremos-vacios-como-ausencia-ordinaria.md','notas/decisiones/ADR-047-cuantificadores-e-iteracion-finita.md','notas/decisiones/ADR-088-iteracion-progresiones-y-bloques-de-expresion.md','notas/decisiones/README.md','especificacion/08-sintaxis-abstracta.md','especificacion/sintaxis/casos/cst-ast.yaml')
          $actual=@(git status --porcelain=v1 --untracked-files=all|%{$p=$_.Substring(3);if($p -match ' -> '){$p=($p -split ' -> ',2)[1]};$p.Trim('"')})|Sort-Object -Unique
          foreach($p in $actual){if($allowed -notcontains $p){throw "unexpected $p"}}
          git diff --stat
      - name: Commit candidato
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT; git config user.email chatgpt@users.noreply.github.com
          git add --all; git diff --cached --check; if($LASTEXITCODE){throw 'staged diff'}
          git commit -m "spec(language): devuelve empty en min y max vacíos" -m "D-093 elimina el error especial inexistente y modela extrema vacía como T [0..1].`n`nValidation: invariantes, decisiones, preguntas, gramática, sintaxis y diff check."; if($LASTEXITCODE){throw 'commit'}
          git push origin HEAD:chatgpt-global-coherence-20260816-v3; if($LASTEXITCODE){throw 'push'}
