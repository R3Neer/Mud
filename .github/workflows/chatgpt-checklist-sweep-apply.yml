name: ChatGPT checklist ADR sweep apply
on:
  push:
    branches: [chatgpt-checklist-runner-sweep-apply]
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-runner-sweep-apply
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-candidate
          path: target
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Verify exact base
        shell: pwsh
        env: {EXPECTED_HEAD: 7a25d21bb6d3a539ddc118384b920ee476258c87}
        run: |
          $ErrorActionPreference='Stop'
          $h=(git -C target rev-parse HEAD).Trim()
          if ($h -ne $env:EXPECTED_HEAD) { throw "base mismatch: $h" }
          if (git -C target status --porcelain=v1 --untracked-files=all) { throw 'candidate not clean' }
      - name: Apply validated historical sweep as patch
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          git fetch origin 2d6390f19640a0e8b86889b5a3ea479bf7341dab
          if ($LASTEXITCODE -ne 0) { throw 'could not fetch historical sweep' }
          git cherry-pick --no-commit 2d6390f19640a0e8b86889b5a3ea479bf7341dab
          if ($LASTEXITCODE -ne 0) {
            git status --short
            git diff --name-only --diff-filter=U
            throw 'historical sweep conflicts with current HEAD'
          }
          python ../control/.chatgpt/fix_sweep_current.py .
          if ($LASTEXITCODE -ne 0) { throw 'current-head adaptation failed' }
      - name: Regenerate decisions
        shell: pwsh
        working-directory: target
        run: |
          python tooling/decisions/manage_decisions.py generate
          if ($LASTEXITCODE -ne 0) { throw 'decision generation failed' }
      - name: Current semantic invariants
        shell: pwsh
        run: |
          python control/.chatgpt/audit_post_sweep.py target
          if ($LASTEXITCODE -ne 0) { throw 'post-sweep audit failed' }
      - name: Official validators
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { throw 'decisions' }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { throw 'questions' }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { throw 'grammar' }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { throw 'syntax' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check' }
      - name: Audit change whitelist and print surface
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          $allowed=@(
            'especificacion/07-gramatica-concreta.md',
            'especificacion/sintaxis/casos/cst-ast.yaml',
            'especificacion/sintaxis/cobertura-sintactica.yaml',
            'notas/decisiones/ADR-028-sistema-de-magnitudes-y-unidades.md',
            'notas/decisiones/ADR-029-intervalos-estrellas-y-ciclos.md',
            'notas/decisiones/ADR-035-organizacion-nombres-using-y-anclas.md',
            'notas/decisiones/ADR-036-participantes-receptores-y-llamadas.md',
            'notas/decisiones/ADR-037-campos-y-dominios-declarativos.md',
            'notas/decisiones/ADR-038-family-y-miembros.md',
            'notas/decisiones/ADR-039-colecciones-y-diccionarios.md',
            'notas/decisiones/ADR-054-definiciones-canonicas-y-activacion-inicial.md',
            'notas/decisiones/ADR-055-tests-declarativos-y-diagnosticos-otherwise.md',
            'notas/decisiones/ADR-061-resultados-fallidos-y-plantillas-text.md',
            'notas/decisiones/ADR-062-magnitudes-de-punto-formatos-y-texto.md',
            'notas/decisiones/ADR-063-firmas-given-y-vinculaciones-on-conjuntas.md',
            'notas/decisiones/ADR-068-thing-universal-y-nombre-intrinseco.md',
            'notas/decisiones/ADR-072-entornos-de-resolucion-y-migraciones-explicitas-de-anclas.md',
            'notas/decisiones/ADR-085-diccionarios-decisionales-metadatos-y-activacion-estructurada.md',
            'notas/decisiones/ADR-086-identidad-nominal-exacta-y-algebra-de-diccionarios.md',
            'notas/decisiones/README.md'
          )
          $actual=@(git status --porcelain=v1 --untracked-files=all | ForEach-Object {$_.Substring(3)})
          Write-Host '--- ACTUAL SURFACE ---'
          $actual | Sort-Object | ForEach-Object { Write-Host $_ }
          $bad=@($actual | Where-Object { $_ -notin $allowed })
          if ($bad.Count) { throw "unexpected paths: $($bad -join ', ')" }
      - name: Commit discovery candidate
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add --all
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'cached diff' }
          git commit -m 'fix(spec): sanea ADR vigentes tras consolidación'
          if ($LASTEXITCODE -ne 0) { throw 'commit' }
          git push origin HEAD:chatgpt-checklist-candidate
          if ($LASTEXITCODE -ne 0) { throw 'push' }
