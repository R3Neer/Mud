name: Validate remote RepoPatcher candidate
run-name: RepoPatcher remote validation ${{ inputs.request_id || 'self-test' }}

on:
  workflow_dispatch:
    inputs:
      protocol:
        description: Validation protocol version
        required: true
        type: string
      request_id:
        description: Durable candidate request identifier
        required: true
        type: string
      target_sha:
        description: Exact repository commit to validate
        required: true
        type: string
      package_sha256:
        description: SHA-256 of the immutable candidate ZIP
        required: true
        type: string
      package_size:
        description: Candidate ZIP size in bytes
        required: true
        type: string
      trust_plugin:
        description: Explicitly authorize a Python plugin
        required: true
        type: boolean
      transport_kind:
        description: MCP transport that produced the immutable ZIP
        required: true
        type: string
  pull_request:
    paths:
      - ".github/workflows/validate-repo-patcher-remote.yml"
      - "tooling/repo-patcher-validator/**"

permissions: {}

concurrency:
  group: ${{ github.event_name == 'workflow_dispatch' && format('repo-patcher-remote-{0}', inputs.request_id) || format('repo-patcher-remote-pr-{0}', github.event.pull_request.number) }}
  cancel-in-progress: false

jobs:
  self_test:
    name: Test remote validator and workflow contract
    if: github.event_name == 'pull_request'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install pinned runtime dependency
        shell: pwsh
        run: tooling/repo-patcher-validator/Install-PinnedDependencies.ps1
      - name: Run validator tests
        shell: pwsh
        run: tooling/repo-patcher-validator/Test-RemoteWorkflow.ps1
      - name: Run pinned actionlint
        shell: bash
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/actionlint.tar.gz"
          curl -fsSL \
            "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz" \
            -o "$archive"
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $archive" | sha256sum -c -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          "$RUNNER_TEMP/actionlint" .github/workflows/validate-repo-patcher-remote.yml

  validate:
    name: Validate immutable candidate on Windows
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Reject an unexpected dispatch context
        shell: pwsh
        env:
          PROTOCOL: ${{ inputs.protocol }}
          REQUEST_ID: ${{ inputs.request_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          PACKAGE_SIZE: ${{ inputs.package_size }}
          TRANSPORT_KIND: ${{ inputs.transport_kind }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:GITHUB_REF -ne "refs/heads/main") { throw "Workflow must run from main." }
          if ($env:PROTOCOL -ne "mud-repo-patcher-validation/v1") { throw "Unsupported protocol." }
          if ($env:REQUEST_ID -notmatch '^[A-Za-z0-9][A-Za-z0-9._-]{0,95}$') { throw "Invalid request ID." }
          if ($env:TARGET_SHA -notmatch '^[0-9a-f]{40}$') { throw "Invalid target SHA." }
          if ($env:PACKAGE_SHA256 -notmatch '^[0-9a-f]{64}$') { throw "Invalid package SHA-256." }
          if ([long]$env:PACKAGE_SIZE -lt 1 -or [long]$env:PACKAGE_SIZE -gt 10485760) { throw "Invalid package size." }
          if ($env:TRANSPORT_KIND -notin @('zip_base64', 'logical_files', 'files_staged_v1')) { throw "Invalid transport kind." }

      - name: Prepare isolated paths
        id: paths
        shell: pwsh
        env:
          REQUEST_ID: ${{ inputs.request_id }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          CONTROL_SHA: ${{ github.workflow_sha }}
        run: |
          $handoff = Join-Path $env:RUNNER_TEMP "repo-patcher-handoff"
          $validation = Join-Path $env:RUNNER_TEMP "repo-patcher-validation"
          $evidence = Join-Path $env:RUNNER_TEMP "repo-patcher-evidence"
          New-Item -ItemType Directory -Path $handoff, $validation, $evidence -Force | Out-Null
          [ordered]@{
            protocol = "mud-repo-patcher-infrastructure/v1"
            request_id = $env:REQUEST_ID
            state = "runner_started"
            workflow_run_id = $env:WORKFLOW_RUN_ID
            run_attempt = $env:RUN_ATTEMPT
            control_sha = $env:CONTROL_SHA
          } | ConvertTo-Json | Set-Content -LiteralPath (Join-Path $evidence "infrastructure.json") -Encoding utf8NoBOM
          @(
            "handoff=$handoff"
            "validation=$validation"
            "evidence=$evidence"
            "package=$(Join-Path $handoff 'candidate.zip')"
            "request=$(Join-Path $handoff 'request.json')"
            "download_metadata=$(Join-Path $evidence 'download-metadata.json')"
          ) | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8

      - name: Checkout trusted control plane
        uses: actions/checkout@v6
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          path: control

      - name: Checkout exact target source
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 0
          persist-credentials: false
          path: target-source

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install pinned runtime dependency
        shell: pwsh
        run: control/tooling/repo-patcher-validator/Install-PinnedDependencies.ps1

      - name: Download immutable candidate with OIDC
        shell: pwsh
        env:
          WORKER_URL: ${{ vars.REPO_PATCHER_WORKER_URL }}
          REQUEST_ID: ${{ inputs.request_id }}
          TARGET_SHA: ${{ inputs.target_sha }}
          PACKAGE_SHA256: ${{ inputs.package_sha256 }}
          PACKAGE_SIZE: ${{ inputs.package_size }}
          TRUST_PLUGIN: ${{ inputs.trust_plugin }}
          TRANSPORT_KIND: ${{ inputs.transport_kind }}
        run: |
          $ErrorActionPreference = "Stop"
          try {
            if (-not $env:WORKER_URL) { throw "Repository variable REPO_PATCHER_WORKER_URL is missing." }
            control/tooling/repo-patcher-validator/Download-Candidate.ps1 `
              -WorkerBaseUrl $env:WORKER_URL `
              -RequestId $env:REQUEST_ID `
              -TargetSha $env:TARGET_SHA `
              -PackageSha256 $env:PACKAGE_SHA256 `
              -PackageSize ([long]$env:PACKAGE_SIZE) `
              -TrustPlugin ([Convert]::ToBoolean($env:TRUST_PLUGIN)) `
              -TransportKind $env:TRANSPORT_KIND `
              -PackageFile '${{ steps.paths.outputs.package }}' `
              -RequestFile '${{ steps.paths.outputs.request }}' `
              -MetadataFile '${{ steps.paths.outputs.download_metadata }}'
          }
          catch {
            $_ | Out-String | Set-Content -LiteralPath (Join-Path '${{ steps.paths.outputs.evidence }}' "download-failure.txt") -Encoding utf8NoBOM
            throw
          }

      - name: Remove candidate credentials
        shell: pwsh
        run: |
          @(
            'ACTIONS_ID_TOKEN_REQUEST_URL',
            'ACTIONS_ID_TOKEN_REQUEST_TOKEN',
            'GITHUB_TOKEN',
            'GH_TOKEN'
          ) | ForEach-Object {
            Remove-Item -LiteralPath "Env:\$_" -ErrorAction SilentlyContinue
          }
          @('ACTIONS_ID_TOKEN_REQUEST_URL', 'ACTIONS_ID_TOKEN_REQUEST_TOKEN') |
            ForEach-Object { "$_=" | Add-Content -LiteralPath $env:GITHUB_ENV -Encoding utf8 }

      - name: Run deterministic validator
        id: validator
        shell: pwsh
        env:
          TARGET_SHA: ${{ inputs.target_sha }}
          CONTROL_SHA: ${{ github.workflow_sha }}
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = "Continue"
          python control/tooling/repo-patcher-validator/validate_candidate.py `
            --control-root control `
            --target-source target-source `
            --validation-root '${{ steps.paths.outputs.validation }}' `
            --package '${{ steps.paths.outputs.package }}' `
            --request '${{ steps.paths.outputs.request }}' `
            --output '${{ steps.paths.outputs.evidence }}' `
            --target-sha $env:TARGET_SHA `
            --control-sha $env:CONTROL_SHA `
            --workflow-run-id $env:WORKFLOW_RUN_ID `
            --run-attempt $env:RUN_ATTEMPT
          "exit_code=$LASTEXITCODE" | Add-Content -LiteralPath $env:GITHUB_OUTPUT -Encoding utf8
          exit 0

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: repo-patcher-validation-${{ inputs.request_id }}-${{ github.run_attempt }}
          path: ${{ steps.paths.outputs.evidence }}
          if-no-files-found: error
          retention-days: 14

      - name: Enforce validation conclusion
        if: always()
        shell: pwsh
        env:
          VALIDATOR_EXIT_CODE: ${{ steps.validator.outputs.exit_code }}
        run: |
          if ($env:VALIDATOR_EXIT_CODE -ne "0") {
            throw "Candidate validation failed; inspect the uploaded result.json and diagnostics."
          }
