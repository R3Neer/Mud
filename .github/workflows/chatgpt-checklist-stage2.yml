name: ChatGPT checklist nominal HIR
on:
  push:
    branches: [chatgpt-checklist-finish-stage2-runner]
permissions:
  contents: write
jobs:
  hir:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-finish-stage2-runner
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-finish-v1
          path: target
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Finish propagation
        shell: pwsh
        env:
          MUD_TARGET: ${{ github.workspace }}\target
        run: python control/.chatgpt/stage2_finish.py
      - name: Validate
        shell: pwsh
        working-directory: target
        env:
          MUD_TARGET: ${{ github.workspace }}\target
        run: |
          python tooling/decisions/manage_decisions.py generate
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          python ../control/.chatgpt/stage2_audit.py
          if ($LASTEXITCODE -ne 0) { exit 1 }
          git diff --check 95d2be08dd652af9f9a3da4f447bb0e813de32ae
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Commit and push
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add --all
          if (-not (git diff --cached --quiet)) { git commit -m 'spec(hir): completa frontera nominal' }
          git push origin HEAD:chatgpt-checklist-finish-v1
