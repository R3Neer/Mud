name: Build unique-by candidate v7 via existing lab path

on:
  push:
    branches:
      - chatgpt/unique-by-v6-control-20260908-7a1f8fc

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Install tooling dependencies
        run: python -m pip install -r tooling/requirements.txt
      - name: Rebuild reviewed candidate with residue fixes
        env:
          BASE_SHA: 7a1f8fcd61028aa00dd0564ca644b501f6da67d3
          V6_SHA: 9473013df1bf5801df5b4b9f654b67a52a2a0767
          CANDIDATE_BRANCH: chatgpt/unique-by-candidate-v7-20260908-7a1f8fc
        shell: bash
        run: |
          set -euo pipefail
          git show origin/chatgpt/unique-by-work-20260908-a1a85b9:notes/MUD-PATCH-UNIQUE-BY-COHERENCE.md > /tmp/plan.md
          mapfile -t changed_paths < <(git diff --name-only "$BASE_SHA" "$V6_SHA")
          git checkout --detach "$BASE_SHA"
          git switch -C "$CANDIDATE_BRANCH"
          cp /tmp/plan.md .mud-patch-unique-by-plan.md
          git checkout "$V6_SHA" -- "${changed_paths[@]}"

          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected exactly one residue, found {text.count(old)}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace(
              'specification/07-concrete-grammar.md',
              'Without `ordered`, every ordinary branch is evaluated and all results are obtained; `unique` removes duplicate results:',
              'Without `ordered`, every ordinary branch is evaluated and all results are obtained; the effective uniqueness modifier then normalises them: ordinary `unique` removes repeated whole values and `unique by path` removes later equal-key results:'
          )
          replace(
              'specification/07-concrete-grammar.md',
              '`^=` accepts only `unique` collections.',
              '`^=` accepts only collections that guarantee whole-value uniqueness; ordinary `unique` and `unique by path` both satisfy that precondition.'
          )
          replace(
              'notes/decisions/ADR-080-higher-order-collection-algebra-and-updates.md',
              '- XOR retains the laws a reader expects because it operates only on `unique` sets.',
              '- XOR retains the laws a reader expects because it operates only on collections that guarantee whole-value uniqueness.'
          )
          plan = Path('.mud-patch-unique-by-plan.md')
          plan.write_text(plan.read_text(encoding='utf-8') + '''

## Findings from the second full review

- Replaced the stale `AllMatches` summary that mentioned only ordinary `unique`.
- Generalised the remaining `^=` and XOR summaries from the `unique` spelling to the whole-value-uniqueness precondition supplied by either uniqueness mode.
''', encoding='utf-8')
          PY

          python tooling/decisions/manage_decisions.py generate
          python -m compileall -q governance specification tooling
          python -m unittest discover -s tooling/tests
          python -m unittest discover -s governance -p "test_*.py"
          python tooling/decisions/manage_decisions.py validate --colour never --ascii
          python tooling/questions/validate_questions.py validate --colour never --ascii
          python governance/validate_temporaries.py --colour never --ascii
          python governance/validate_spec_editorial.py --colour never --ascii
          python specification/grammar/validate_grammar.py --colour never --ascii
          python specification/syntax/validate_syntax_model.py --colour never --ascii
          markdown-export --colour never --ascii list-profiles --root . --config markdown-export.toml >/dev/null
          git diff --check

          ! grep -R -n --fixed-strings 'Without `ordered`, every ordinary branch is evaluated and all results are obtained; `unique` removes duplicate results' notes specification
          ! grep -R -n --fixed-strings '`^=` accepts only `unique` collections' notes specification
          ! grep -R -n --fixed-strings 'operates only on `unique` sets' notes specification
          ! grep -R -n -E 'order-key-path|order_key_path|flag is_unique|flag make_unique|OrderKeyPathSyntax' specification
          test -f .mud-patch-unique-by-plan.md
          ! git ls-files --error-unmatch .mud-patch-unique-by-plan.md >/dev/null 2>&1

          git add notes/decisions notes/questions specification
          if git diff --cached --name-only | grep -E '^\.github/|MUD-PATCH'; then
            echo 'temporary infrastructure staged' >&2
            exit 1
          fi
          git diff --cached --check
          git config user.name 'ChatGPT MUD patch'
          git config user.email 'chatgpt-mud-patch@users.noreply.github.com'
          git commit -m 'spec(collections): add keyed uniqueness by stable path' -m 'Define unique by path with first-by-stable-provenance semantics; propagate collections, dictionaries, algebra, concurrency, grammar and Surface AST; preserve ordinary unique and add keyed syntax coverage. Validation: official gates, tooling/governance tests, markdown export, residue assertions and git diff --check.'

          python tooling/decisions/manage_decisions.py validate --colour never --ascii
          python tooling/questions/validate_questions.py validate --colour never --ascii
          python governance/validate_temporaries.py --colour never --ascii
          python governance/validate_spec_editorial.py --colour never --ascii
          python specification/grammar/validate_grammar.py --colour never --ascii
          python specification/syntax/validate_syntax_model.py --colour never --ascii
          git diff --check "$BASE_SHA"..HEAD
          test -z "$(git status --porcelain --untracked-files=no)"
          test -f .mud-patch-unique-by-plan.md
          ! git ls-files --error-unmatch .mud-patch-unique-by-plan.md >/dev/null 2>&1
          echo "candidate_sha=$(git rev-parse HEAD)"
          git push origin HEAD:"refs/heads/$CANDIDATE_BRANCH"
