name: ChatGPT global coherence residue audit v3
on:
  push:
    branches: [chatgpt-global-coherence-resume-runner-n]
permissions: {contents: read}
jobs:
  residue-audit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-resume-runner-n, path: runner, fetch-depth: 0}
      - uses: actions/checkout@v6
        with: {ref: chatgpt-global-coherence-resume-20260816-i, path: target, fetch-depth: 0}
      - name: Base candidata exacta
        shell: pwsh
        working-directory: target
        env: {BASE: 2ed7fcfc069cca72b60f08ff6e4e7074d9e93661}
        run: |
          if((git rev-parse HEAD).Trim() -ne $env:BASE){throw 'base mismatch'}
          if(git status --porcelain=v1 --untracked-files=all){throw 'dirty base'}
      - name: Barrido de residuos
        shell: pwsh
        working-directory: target
        run: |
          Copy-Item ../runner/tooling/chatgpt/resume_global_residue_audit.py ./audit.py
          python audit.py
          Remove-Item audit.py
