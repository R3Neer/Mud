name: Validate exact unique-by candidate cross-platform

on:
  push:
    branches:
      - chatgpt/unique-by-audit-control-9473013

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: tooling/requirements.txt
      - name: Checkout exact candidate
        shell: bash
        run: |
          git checkout --detach 6d71f5289c0f9e51fb6cc21da450ed684a109c44
          test "$(git rev-parse HEAD)" = "6d71f5289c0f9e51fb6cc21da450ed684a109c44"
      - name: Install tooling dependencies
        run: python -m pip install -r tooling/requirements.txt
      - name: Compile Python
        run: python -m compileall -q governance specification tooling
      - name: Tooling tests
        run: python -m unittest discover -s tooling/tests
      - name: Governance tests
        run: python -m unittest discover -s governance -p "test_*.py"
      - name: Validate decisions
        run: python tooling/decisions/manage_decisions.py validate --colour never --ascii
      - name: Validate questions
        run: python tooling/questions/validate_questions.py validate --colour never --ascii
      - name: Validate temporaries
        run: python governance/validate_temporaries.py --colour never --ascii
      - name: Validate editorial rules
        run: python governance/validate_spec_editorial.py --colour never --ascii
      - name: Validate grammar
        run: python specification/grammar/validate_grammar.py --colour never --ascii
      - name: Validate syntax model
        run: python specification/syntax/validate_syntax_model.py --colour never --ascii
      - name: Validate markdown export config
        run: markdown-export --colour never --ascii list-profiles --root . --config markdown-export.toml
      - name: Diff whitespace check
        run: git diff --check 7a1f8fcd61028aa00dd0564ca644b501f6da67d3..HEAD
      - name: Confirm exact candidate tree is clean
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "6d71f5289c0f9e51fb6cc21da450ed684a109c44"
          test -z "$(git status --porcelain)"
