name: ChatGPT checklist architecture fix
on:
  push:
    branches: [chatgpt-checklist-runner-archfix]
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-runner-archfix
          path: control
          persist-credentials: false
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-checklist-candidate
          path: target
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v6
        with: {python-version: '3.13'}
      - shell: pwsh
        run: python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
      - name: Verify base and apply
        shell: pwsh
        env: {EXPECTED_HEAD: 34a7c56b08834fae7e6042321fff698ba5c33b40}
        run: |
          $ErrorActionPreference='Stop'
          $h=(git -C target rev-parse HEAD).Trim()
          if ($h -ne $env:EXPECTED_HEAD) { throw "base mismatch: $h" }
          python control/.chatgpt/fix_d092_ast_ir.py target
          if ($LASTEXITCODE -ne 0) { throw 'fix failed' }
      - name: Validate
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { throw 'decisions' }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { throw 'questions' }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { throw 'grammar' }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { throw 'syntax' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff' }
          $paths=@(git status --porcelain=v1 --untracked-files=all | ForEach-Object {$_.Substring(3)})
          if ($paths.Count -ne 1 -or $paths[0] -ne 'notas/decisiones/ADR-092-disponibilidad-estatica-de-propiedades-reflectivas.md') { throw "unexpected surface: $paths" }
      - name: Commit
        shell: pwsh
        working-directory: target
        run: |
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add --all
          git commit -m 'fix(spec): alinea D-092 con el IR semántico'
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:chatgpt-checklist-candidate
          if ($LASTEXITCODE -ne 0) { throw 'push failed' }
