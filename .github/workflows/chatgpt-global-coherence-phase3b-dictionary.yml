name: ChatGPT global coherence phase 3b dictionary

on:
  push:
    branches:
      - chatgpt-global-coherence-runner-v3b-dictionary

permissions:
  contents: write

jobs:
  dictionary-identity:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-global-coherence-runner-v3b-dictionary
          path: runner
          fetch-depth: 0
      - uses: actions/checkout@v6
        with:
          ref: chatgpt-global-coherence-20260816-v5
          path: target
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check "PyYAML==6.0.3"
      - name: Verify accepted base
        shell: pwsh
        working-directory: target
        env:
          BASE: a9939d3cba144ec2b69d521672321b2eec48c00d
        run: |
          $ErrorActionPreference='Stop'
          if ((git rev-parse HEAD).Trim() -ne $env:BASE) { throw 'candidate base mismatch' }
          if (git status --porcelain=v1 --untracked-files=all) { throw 'candidate not clean' }
      - name: Apply dictionary identity phase
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          New-Item -ItemType Directory -Force tooling/chatgpt | Out-Null
          Copy-Item ../runner/tooling/chatgpt/global_coherence_phase3_dictionary.py tooling/chatgpt/phase3.py
          Copy-Item ../runner/tooling/chatgpt/global_coherence_phase3b_review.py tooling/chatgpt/phase3b.py
          python tooling/chatgpt/phase3.py
          if ($LASTEXITCODE -ne 0) { throw 'dictionary transform failed' }
          python tooling/chatgpt/phase3b.py
          if ($LASTEXITCODE -ne 0) { throw 'human-review correction failed' }
          Remove-Item tooling/chatgpt/phase3.py,tooling/chatgpt/phase3b.py
          python tooling/decisions/manage_decisions.py generate
          if ($LASTEXITCODE -ne 0) { throw 'decision index generation failed' }
      - name: Stage 1 dictionary invariants
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          @'
          from pathlib import Path
          def r(p): return Path(p).read_text(encoding='utf-8')
          def need(p,s):
              if s not in r(p): raise SystemExit(f'{p}: missing {s!r}')
          def forbid(p,s):
              if s in r(p): raise SystemExit(f'{p}: stale {s!r}')
          need('notas/decisiones/ADR-090-ramas-funcionales-sin-ancla-publica.md','SelectorBranchKey(canonical_selector, duplicate_index)')
          need('notas/decisiones/ADR-090-ramas-funcionales-sin-ancla-publica.md','no conserva un segundo flag `is_fallback`')
          need('especificacion/09-nombres-y-anclas.md','MUD-NAME-006')
          need('especificacion/sintaxis/mud-resolved-ast.asdl','decision_branch_key = SelectorBranchKey')
          need('especificacion/sintaxis/mud-resolved-ast.asdl','DecisionDependsOn(anchor dictionary, decision_branch_key branch, symbol_id target)')
          forbid('especificacion/sintaxis/mud-resolved-ast.asdl','ResolvedDecisionBranch(anchor identity')
          forbid('especificacion/sintaxis/mud-resolved-ast.asdl','DecisionDependsOn(anchor branch')
          forbid('especificacion/sintaxis/mud-resolved-ast.asdl','string is_fallback')
          forbid('especificacion/09-nombres-y-anclas.md','## Anclas de ramas funcionales')
          forbid('notas/decisiones/ADR-085-diccionarios-decisionales-metadatos-y-activacion-estructurada.md','mediante sus anclas propias')
          need('notas/decisiones/ADR-087-metadatos-reflectivos-descriptores-estables-y-visibilidad-exterior.md','Una rama de diccionario funcional tampoco posee ancla pública')
          print('PHASE3B_DICTIONARY_INVARIANTS_OK')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'dictionary invariants failed' }
      - name: Stage 2 official validators
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          python tooling/decisions/manage_decisions.py validate
          if ($LASTEXITCODE -ne 0) { throw 'decision validation failed' }
          python tooling/questions/validate_questions.py
          if ($LASTEXITCODE -ne 0) { throw 'question validation failed' }
          python especificacion/gramatica/validate_grammar.py
          if ($LASTEXITCODE -ne 0) { throw 'grammar validation failed' }
          python especificacion/sintaxis/validate_syntax_model.py
          if ($LASTEXITCODE -ne 0) { throw 'syntax validation failed' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff check failed' }
      - name: Stage 3 controlled surface
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          $allowed=@(
            'notas/decisiones/ADR-085-diccionarios-decisionales-metadatos-y-activacion-estructurada.md',
            'notas/decisiones/ADR-087-metadatos-reflectivos-descriptores-estables-y-visibilidad-exterior.md',
            'notas/decisiones/ADR-090-ramas-funcionales-sin-ancla-publica.md',
            'notas/decisiones/README.md',
            'especificacion/08-sintaxis-abstracta.md',
            'especificacion/09-nombres-y-anclas.md',
            'especificacion/sintaxis/mud-resolved-ast.asdl'
          )
          $actual=@(git status --porcelain=v1 --untracked-files=all | % { $p=$_.Substring(3); if($p -match ' -> '){$p=($p -split ' -> ',2)[1]}; $p.Trim('"') }) | Sort-Object -Unique
          foreach($p in $actual){ if($allowed -notcontains $p){ throw "unexpected path: $p" } }
          foreach($p in $allowed){ if($actual -notcontains $p){ throw "expected path not changed: $p" } }
          git diff --stat
      - name: Commit candidate phase
        shell: pwsh
        working-directory: target
        run: |
          $ErrorActionPreference='Stop'
          git config user.name ChatGPT
          git config user.email chatgpt@users.noreply.github.com
          git add --all
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { throw 'staged diff failed' }
          git commit -m "spec(language): retira anclas públicas de ramas funcionales" -m "D-090 alinea D-085 con D-087. Las ramas usan una clave local normalizada en el AST resuelto; FallbackBranchKey elimina el antiguo flag redundante.`n`nValidation: invariantes específicas, decisiones, preguntas, gramática, sintaxis y git diff --check."
          if ($LASTEXITCODE -ne 0) { throw 'commit failed' }
          git push origin HEAD:chatgpt-global-coherence-20260816-v5
          if ($LASTEXITCODE -ne 0) { throw 'candidate push failed' }
