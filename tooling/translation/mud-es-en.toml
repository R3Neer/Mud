temporary = true
temporary-reason = "Aplicar de forma reproducible las decisiones terminológicas durante la migración al inglés."
temporary-delete-when = "La migración completa del contenido y las rutas al inglés haya concluido y las reglas terminológicas permanentes se hayan integrado en su ubicación definitiva."

[language]
source = "ES"
target = "EN-GB"

[protected]
literals = ["using", "thing", "as", "alias", "family", "magnitude", "rule", "action", "subaction", "look", "message", "test", "for", "on", "given", "when", "changes", "if", "then", "after", "with", "otherwise", "mut", "unique", "ordered", "create", "destroy", "add", "remove", "from", "each", "by", "through", "take", "exists", "forall", "count", "min", "max", "to", "eventually", "allowed", "old", "is", "iis", "in", "has", "not", "and", "or", "xor", "Text", "Char", "Bool", "Thing", "Any", "Nat", "Int", "Num", "Rum", "Money", "Rand", "Name", "MudPath", "Anchor", "MudFile", "Prefix", "true", "false", "empty", "all", "_", "abstract", "always", "start", "value", "type", "name", "path", "anchor", "file", "plural", "abbreviation", "prefixes", "format", "root", "unit", "point", "over", "cycle"]
patterns = [
  "\\b(?:D|Q)-\\d{3}\\b",
  "\\bMUD-[A-Z]+-\\d{3}\\b",
  "\\bADR-\\d{3}\\b",
]

[frontmatter]
translate = ["title", "aliases", "scope", "intent", "temporary-reason", "temporary-delete-when"]
preserve = ["status", "tags", "decisions", "questions", "chapter", "normative", "version", "authority", "supersedes", "replaced-by", "temporary", "temporary-delete-after"]

[style]
forbidden = [
  "behavior", "behaviors", "behavioral",
  "color", "colors", "colored", "coloring",
  "modeling", "modeled", "modeler",
  "materialization", "materialized", "materializing", "materializer",
  "authorization", "authorized", "unauthorized",
  "stabilization",
]
guidance = [
  "Use British English: behaviour, modelling, materialisation and authorisation.",
  "Keep Mud as the proper name, .mud as the extension and mud only where code requires it.",
  "Keep literal Mud constructs in backticks in technical prose.",
  "Prefer semantic operator to semantic editor.",
  "Prefer materialiser to generator.",
  "Distinguish rule from requirement, effect from consequence, failure from error, and rejected from failed.",
  "Translate visible chapter, decision and question names, but do not rename their paths or wikilink targets in this phase.",
]

[checks]
probable-source = [
  "para", "pero", "también", "debe", "deben", "puede", "pueden",
  "cuando", "donde", "desde", "hasta", "sobre", "entre", "según",
  "esta", "este", "estos", "estas", "cada", "ningún", "ninguna",
]

[markdown]
wikilinks = true
embeds = true
callouts = true


